name: firefly-ai-folder-desktop-release

on:
  workflow_dispatch:
    inputs:
      platform_macos:
        description: '构建 macOS 平台'
        required: false
        type: boolean
        default: true
      platform_windows:
        description: '构建 Windows 平台'
        required: false
        type: boolean
        default: true
      platform_linux:
        description: '构建 Linux 平台'
        required: false
        type: boolean
        default: true
      download_latest_llama:
        description: '是否重新下载并更新最新的 llama.cpp 核心依赖包 (默认为 true)'
        required: true
        type: boolean
        default: true
      linux_runner:
        description: '选择 Linux 构建的运行 Runner 环境 (默认 ubuntu-latest)'
        required: true
        type: choice
        default: 'ubuntu-latest'
        options:
          - 'ubuntu-latest'
          - 'self-hosted'
      build_region:
        description: '构建区域 (国际版 INTL 或 国内版 CN)'
        required: true
        type: choice
        default: 'CN'
        options:
          - 'CN'
          - 'INTL'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.platform_macos == 'true' || github.event.inputs.platform_macos == true))
    runs-on: macos-latest
    steps:
      - name: Checkout Open-Source Desktop Code
        uses: actions/checkout@v4

      - name: Checkout Private Pro Module
        uses: actions/checkout@v4
        with:
          repository: Leonard-Li777/firefly-ai-folder-desktop-pro
          token: ${{ secrets.PRO_SUBMODULE_TOKEN || secrets.UNISOURCE_RELEASE_TOKEN || secrets.PRIVATE_MONOREPO_PAT || secrets.SUBMODULE_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.RELEASE_TOKEN }}
          path: pro

      - name: Install macOS Dependencies
        shell: bash
        run: |
          if ! command -v gh &>/dev/null; then
            echo "🔧 gh CLI 未安装，正在安装..."
            brew install gh
          fi
          echo "gh version: $(gh --version)"

          if ! command -v 7z &>/dev/null; then
            echo "🔧 7z 未安装，正在安装 p7zip..."
            brew install p7zip
          fi
          echo "7z version: $(7z --help 2>&1 | head -2)"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: 'pnpm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
        env:
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/

      - name: Approve all builds
        run: pnpm approve-builds --all

      - name: Ensure Electron Binary Downloaded
        run: pnpm run rebuild:electron-binary || true
        env:
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/

      - name: Debug Electron Require
        shell: bash
        run: |
          node -e "
          try {
            const path = require('electron');
            const pkgVer = require('electron/package.json').version;
            console.log('Electron Path:', path);
            console.log('Electron Package Version:', pkgVer);
            try {
              const { execSync } = require('child_process');
              const binVer = execSync('\"' + path + '\" --version').toString().trim();
              console.log('Electron Binary Version:', binVer);
            } catch (err) {
              console.log('Electron Binary execution warning:', err.message);
            }
          } catch (e) {
            console.error('Electron Require Failed Error:', e);
            process.exit(1);
          }
          "
        env:
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/

      - name: Rebuild native dependencies
        run: pnpm run rebuild:all
        env:
          BUILD_ARCH: universal

      - name: Install Sharp cross-platform dependencies
        run: pnpm run install-sharp-cross-platform

      - name: Create Production Env
        shell: bash
        env:
          ENV_BASE_B64: ${{ secrets.ENV_BASE }}
          ENV_PROD_B64: ${{ secrets.ENV_PROD }}
        run: |
          echo "📝 Injecting environment variables from Base64..."
          echo "$ENV_BASE_B64" | base64 --decode > .env
          echo "$ENV_PROD_B64" | base64 --decode > .env.production
          echo "📄 Showing filtered .env contents:"
          grep -E "VITE_POSTHOG_HOST|SUPABASE_URL" .env || true

      - name: Cache/Restore built-in models
        id: cache-models
        uses: actions/cache@v4
        with:
          path: build/extraResources/models
          key: llama-models-shared-v3

      - name: Download Magika & PP-OCRv6 Models on Cache Miss
        if: steps.cache-models.outputs.cache-hit != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          command -v gh &>/dev/null || { echo "❌ gh CLI 不可用"; exit 1; }
          mkdir -p build/extraResources/models/magika build/extraResources/models/PP-OCRv6
          TEMP_ZIP=$(mktemp)
          echo "📥 从 firefly-resources 下载 magika 与 PP-OCRv6 模型..."
          if gh release download resources --pattern "magika-resources.zip" --repo "Leonard-Li777/firefly-resources" --output "$TEMP_ZIP" --clobber 2>/dev/null; then
            unzip -o -q "$TEMP_ZIP" -d build/extraResources/models/magika
            rm -f "$TEMP_ZIP"
            echo "✅ magika-resources.zip 恢复完成。"
          fi
          if gh release download resources --pattern "ppocrv6-resources.zip" --repo "Leonard-Li777/firefly-resources" --output "$TEMP_ZIP" --clobber 2>/dev/null; then
            unzip -o -q "$TEMP_ZIP" -d build/extraResources/models/PP-OCRv6
            rm -f "$TEMP_ZIP"
            echo "✅ ppocrv6-resources.zip 恢复完成。"
          fi

      - name: Cache/Restore preset resources (fastfetch, llama.cpp)
        id: cache-presets
        uses: actions/cache@v4
        with:
          path: build/presetResources
          key: llama-presets-darwin-v2

      - name: Download llama-model-download on Cache Miss
        if: steps.cache-presets.outputs.cache-hit != 'true' || github.event.inputs.download_latest_llama == 'true' || github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/presetResources/llama-model-download
          echo "📥 从 firefly-resources 下载 llama-model-download..."
          gh release download resources --pattern "llama-model-download-*" --repo "Leonard-Li777/firefly-resources" --dir "build/presetResources/llama-model-download" --clobber 2>/dev/null || true
          echo "✅ llama-model-download 资源准备完成。"

      - name: Download fastfetch on Cache Miss (firefly-resources)
        if: steps.cache-presets.outputs.cache-hit != 'true' || github.event.inputs.download_latest_llama == 'true' || github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/presetResources/fastfetch
          echo "📥 从 firefly-resources 下载 fastfetch (macOS)..."
          ffarch=arm64
          [ "$(uname -m)" = "x86_64" ] || [ "$(uname -m)" = "amd64" ] && ffarch=x64
          gh release download resources --pattern "fastfetch-*-darwin-$ffarch.zip" --repo "Leonard-Li777/firefly-resources" --dir "build/presetResources/fastfetch" --clobber 2>/dev/null || true
          echo "✅ fastfetch 资源准备完成。"

      - name: Sync Llama.cpp (Bypassed if cache hit and download_latest_llama is false)
        shell: bash
        env:
          DOWNLOAD_LATEST_LLAMA: ${{ github.event.inputs.download_latest_llama || 'true' }}
          FORCE_UPDATE: ${{ github.event.inputs.download_latest_llama || 'true' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ steps.cache-presets.outputs.cache-hit }}" != "true" || "${{ github.event.inputs.download_latest_llama }}" == "true" ]]; then
            echo "📥 Syncing llama.cpp engine..."
            AI_ENGINE=llama.cpp pnpm run download:llama
          fi

      - name: Setup Resources (Basic)
        if: steps.cache-presets.outputs.cache-hit != 'true' || github.event.inputs.download_latest_llama == 'true' || github.event_name == 'push'
        run: pnpm run setup-resources
        env:
          AI_ENGINE: llama.cpp
          FORCE_UPDATE_LLAMACPP: ${{ github.event.inputs.download_latest_llama || 'true' }}

      - name: Download Built-in LFM2.5 Model (firefly-resources)
        if: steps.cache-models.outputs.cache-hit != 'true' || github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          command -v gh &>/dev/null || { echo "❌ gh CLI 不可用"; exit 1; }
          echo "📥 从 firefly-resources 下载内置模型 LFM2.5 1.2B Instruct..."
          TMP_LFM="${RUNNER_TEMP:-/tmp}/lfm"
          mkdir -p "$TMP_LFM"
          if gh release download resources --pattern "LFM2.5-1.2B-Instruct-GGUF--Q4_K_M.zip" --repo "Leonard-Li777/firefly-resources" --dir "$TMP_LFM" --clobber 2>/dev/null; then
            ZIP_FILE=$(find "$TMP_LFM" -name "LFM2.5-1.2B-Instruct-GGUF--Q4_K_M.zip" | head -n 1)
            if [ -n "$ZIP_FILE" ] && [ -f "$ZIP_FILE" ]; then
              mkdir -p build/extraResources/models
              echo "📦 跨平台安全解压内置模型到 build/extraResources/models..."
              python3 -c "import zipfile, os, sys; dest=sys.argv[2]; z=zipfile.ZipFile(sys.argv[1]); [(lambda n, t: [os.remove(t) if os.path.isfile(t) else None, os.makedirs(t, exist_ok=True)] if (m.is_dir() or n.endswith('/') or '.' not in os.path.basename(n)) else [os.remove(os.path.dirname(t)) if os.path.isfile(os.path.dirname(t)) else None, os.makedirs(os.path.dirname(t), exist_ok=True), not os.path.isdir(t) and open(t, 'wb').write(z.read(m))])(m.filename.replace('\\\\\\\\', '/').replace('\\\\', '/').strip('/'), os.path.join(dest, m.filename.replace('\\\\\\\\', '/').replace('\\\\', '/').strip('/'))) for m in z.infolist() if m.filename.strip()]" "$ZIP_FILE" "build/extraResources/models" 2>/dev/null || unzip -o -q "$ZIP_FILE" -d build/extraResources/models || true
              echo "✅ 内置模型 LFM2.5 1.2B Instruct 恢复完成。"
            fi
            rm -rf "$TMP_LFM"
          else
            echo "⚠️ firefly-resources 未找到内置模型 zip，继续执行 download:builtin-model 兜底。"
          fi

      - name: 下载内置模型并清理投影文件 (llama-model-download)
        if: steps.cache-models.outputs.cache-hit != 'true' || github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          echo "📥 使用 llama-model-download 准备内置模型..."
          pnpm run download:builtin-model

      - name: 下载 firefly-omni 引擎 (firefly-resources)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/extraResources/bin/omni
          echo "📥 从 firefly-resources 下载 firefly-omni (macOS)..."
          TMP_OMNI="/tmp/omni-pkg"
          mkdir -p "$TMP_OMNI"
          DOWNLOADED=false
          for pattern in "firefly-omni-*-darwin-universal.tar.gz" "firefly-omni-*-darwin-x64.tar.gz" "firefly-omni-*-darwin-arm64.tar.gz" "firefly-omni-*-darwin-*.zip"; do
            if gh release download resources --pattern "$pattern" --repo "Leonard-Li777/firefly-resources" --dir "$TMP_OMNI" --clobber 2>/dev/null; then
              ARCHIVE=$(find "$TMP_OMNI" -name "firefly-omni-*" 2>/dev/null | head -n 1)
              if [ -n "$ARCHIVE" ] && [ -f "$ARCHIVE" ]; then
                echo "📦 解压 $ARCHIVE 到 build/extraResources/bin/omni..."
                if [[ "$ARCHIVE" == *.tar.gz ]]; then
                  tar -xzf "$ARCHIVE" -C build/extraResources/bin/omni
                else
                  unzip -o -q "$ARCHIVE" -d build/extraResources/bin/omni
                fi
                chmod +x build/extraResources/bin/omni/firefly-omni 2>/dev/null || true
                echo "✅ firefly-omni macOS 引擎部署完成。"
                DOWNLOADED=true
                break
              fi
            fi
          done
          rm -rf "$TMP_OMNI"
          if [ "$DOWNLOADED" != "true" ]; then
            echo "⚠️ firefly-resources 暂未检索到 firefly-omni macOS 资产，跳过引擎装配（不阻塞构建）。"
          fi

      - name: 下载 omni-geo 数据集
        shell: bash
        run: |
          echo "📥 从 firefly-resources 下载 omni-geo 地理数据集..."
          mkdir -p build/extraResources/geo
          if gh release download resources --pattern "geo-*.tar.gz" \
            --repo "Leonard-Li777/firefly-resources" --dir "/tmp/geo-pkg" --clobber 2>/dev/null; then
            GEO_ARCHIVE=$(find /tmp/geo-pkg -name "geo-*.tar.gz" 2>/dev/null | head -n 1 || true)
            if [ -n "$GEO_ARCHIVE" ] && [ -f "$GEO_ARCHIVE" ]; then
              tar xzf "$GEO_ARCHIVE" -C build/extraResources/geo
              rm -rf /tmp/geo-pkg
              echo "✅ omni-geo 数据集从 firefly-resources 恢复完成。"
            else
              echo "⚠️ 未在本地目录发现 geo 压缩包，跳过（不阻塞构建）。"
              rm -rf /tmp/geo-pkg
            fi
          else
            echo "⚠️ 未找到 geo 数据集，跳过（不阻塞构建）。"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify extraResources (不多不少门禁)
        shell: bash
        run: |
          echo "🔍 校验最终打包目录 build/extraResources 是否不多不少..."
          node pro/scripts/run.js verify-extra-resources.js --prune

      - name: Copy App Icons
        shell: bash
        run: |
          mkdir -p build assets
          ASSETS_SRC="build/extraResources/assets"
          [ ! -d "$ASSETS_SRC" ] && ASSETS_SRC="assets"
          [ -f "$ASSETS_SRC/icon.ico" ] && cp "$ASSETS_SRC/icon.ico" build/icon.ico && cp "$ASSETS_SRC/icon.ico" assets/icon.ico || true
          [ -f "$ASSETS_SRC/icon.icns" ] && cp "$ASSETS_SRC/icon.icns" build/icon.icns && cp "$ASSETS_SRC/icon.icns" assets/icon.icns || true
          [ -f "$ASSETS_SRC/icon.png" ] && cp "$ASSETS_SRC/icon.png" build/icon.png && cp "$ASSETS_SRC/icon.png" assets/icon.png || true
          if [ "${{ github.event.inputs.build_region }}" = "INTL" ]; then
            cp "$ASSETS_SRC/boot_en.jpg" build/boot.jpg 2>/dev/null || cp "$ASSETS_SRC/boot.jpg" build/boot.jpg 2>/dev/null || true
          else
            cp "$ASSETS_SRC/boot.jpg" build/boot.jpg 2>/dev/null || true
          fi
          [ -f build/boot.jpg ] && cp build/boot.jpg build/boot.gif || true

      - name: Build macOS Application (llama.cpp)
        run: |
          if [ "${{ github.event.inputs.build_region }}" = "INTL" ]; then
            pnpm run make:intl
          else
            pnpm run make
          fi
        env:
          AI_ENGINE: llama.cpp
          BUILD_REGION: ${{ github.event.inputs.build_region || 'CN' }}
          BUILD_ARCH: universal

      - name: Verify macOS Release Artifacts (Smoke Test)
        shell: bash
        run: |
          echo "🔍 正在检索 out/make 目录下的 macOS 构建产物..."
          DMG_FILE=$(find out/make -name "*.dmg" 2>/dev/null | head -n 1)
          if [ -z "$DMG_FILE" ] || [ ! -f "$DMG_FILE" ]; then
            echo "⚠️ 未在 out/make 找到 .dmg 文件，尝试查找 .app 解包产物..."
            APP_CANDIDATE=$(find out -name "*.app" -type d 2>/dev/null | head -n 1)
            if [ -z "$APP_CANDIDATE" ]; then
              echo "❌ 未找到可测试的 macOS 产物！"
              exit 1
            fi
            MOUNT_CLEANUP=false
            LOCAL_APP="$APP_CANDIDATE"
          else
            echo "📦 找到安装包: $DMG_FILE，正在挂载测试..."
            MOUNT_DIR="/tmp/FireflyBuildMount"
            mkdir -p "$MOUNT_DIR"
            hdiutil attach "$DMG_FILE" -mountpoint "$MOUNT_DIR" -nobrowse
            
            APP_NAME=$(ls -d "$MOUNT_DIR"/*.app 2>/dev/null | head -n 1)
            if [ -z "$APP_NAME" ]; then
              echo "❌ DMG 镜像内未找到 .app bundle！"
              hdiutil detach "$MOUNT_DIR" || true
              exit 1
            fi
            
            echo "Found app bundle inside DMG: $APP_NAME"
            mkdir -p /tmp/FireflyTestExtract
            cp -R "$APP_NAME" /tmp/FireflyTestExtract/
            hdiutil detach "$MOUNT_DIR" || true
            LOCAL_APP="/tmp/FireflyTestExtract/$(basename "$APP_NAME")"
          fi

          echo "Removing quarantine attributes on $LOCAL_APP..."
          xattr -dr com.apple.quarantine "$LOCAL_APP" 2>/dev/null || true

          BIN_PATH=$(find "$LOCAL_APP/Contents/MacOS" -type f -perm +111 2>/dev/null | head -n 1)
          if [ -z "$BIN_PATH" ]; then
            echo "❌ 未找到 App 可执行二进制文件！"
            exit 1
          fi

          echo "🎯 可执行文件路径: $BIN_PATH"
          echo "=== [1/3] 检查二进制架构 ==="
          lipo -info "$BIN_PATH" || file "$BIN_PATH"

          # 1. 测试原生 ARM64 启动
          echo "=== [2/3] 测试原生 ARM64 启动 (15s 烟雾测试) ==="
          arch -arm64 "$BIN_PATH" --no-sandbox --disable-gpu > /tmp/app-arm64.log 2>&1 &
          APP_PID=$!
          echo "Native ARM64 PID: $APP_PID"
          for i in {1..8}; do
            sleep 2
            if ! kill -0 $APP_PID 2>/dev/null; then
              echo "❌ Native ARM64 应用启动失败或崩溃！"
              cat /tmp/app-arm64.log || true
              exit 1
            fi
            echo "  -> ARM64 运行健康检测 at $((i*2))s: 进程存活"
          done
          kill -15 $APP_PID 2>/dev/null || kill -9 $APP_PID 2>/dev/null || true
          echo "✅ Native ARM64 15s 烟雾测试通过！"

          # 2. 如果是 Universal 二进制，测试 Rosetta 2 x86_64 仿真启动
          IS_UNIVERSAL=$(lipo -info "$BIN_PATH" 2>/dev/null | grep -E "x86_64.*arm64|arm64.*x86_64" || true)
          if [ -n "$IS_UNIVERSAL" ]; then
            echo "=== [3/3] 测试 Rosetta 2 (x86_64) 仿真启动 (15s 烟雾测试) ==="
            arch -x86_64 "$BIN_PATH" --no-sandbox --disable-gpu > /tmp/app-x86.log 2>&1 &
            APP_PID_X86=$!
            echo "Rosetta 2 x86_64 PID: $APP_PID_X86"
            for i in {1..8}; do
              sleep 2
              if ! kill -0 $APP_PID_X86 2>/dev/null; then
                echo "❌ Rosetta 2 x86_64 仿真启动失败或崩溃！"
                cat /tmp/app-x86.log || true
                exit 1
              fi
              echo "  -> x86_64 运行健康检测 at $((i*2))s: 进程存活"
            done
            kill -15 $APP_PID_X86 2>/dev/null || kill -9 $APP_PID_X86 2>/dev/null || true
            echo "✅ Rosetta 2 x86_64 仿真 15s 烟雾测试通过！"
          fi

          echo "🎉 macOS 构建产物全部通过安装与启动验证，准备执行发布！"


      - name: Publish to Cloudflare R2
        shell: bash
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_DOMAIN: ${{ secrets.R2_PUBLIC_DOMAIN }}
        run: |
          echo "📤 Uploading package to Cloudflare R2..."
          pnpm run publish:r2 || echo "⚠️ R2 发布跳过或无配置"

      - name: Publish to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME:-v$(node -p "require('./package.json').version")}"
          echo "🏷️ 当前发布版本 Tag: $TAG"
          gh release view "$TAG" 2>/dev/null || gh release create "$TAG" --title "$TAG" --generate-notes || true

          FILES=()
          while IFS= read -r -d '' f; do
            FILES+=("$f")
          done < <(find out/make -type f \( -name "*.dmg" -o -name "*.pkg" -o -name "*.exe" -o -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" -o -name "*.zip" -o -name "*.tar.gz" -o -name "RELEASES" \) -print0 2>/dev/null)

          if [ ${#FILES[@]} -gt 0 ]; then
            echo "📤 正在上传 ${#FILES[@]} 个构建产物到 GitHub Release ($TAG)..."
            gh release upload "$TAG" "${FILES[@]}" --clobber
            echo "✅ GitHub Release 产物发布成功"
          else
            echo "⚠️ 未在 out/make 目录下找到匹配的安装包产物"
          fi

  build-windows:
    name: Build Windows
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.platform_windows == 'true' || github.event.inputs.platform_windows == true))
    runs-on: windows-2022
    steps:
      - name: Checkout Open-Source Desktop Code
        uses: actions/checkout@v4

      - name: Checkout Private Pro Module
        uses: actions/checkout@v4
        with:
          repository: Leonard-Li777/firefly-ai-folder-desktop-pro
          token: ${{ secrets.PRO_SUBMODULE_TOKEN || secrets.UNISOURCE_RELEASE_TOKEN || secrets.PRIVATE_MONOREPO_PAT || secrets.SUBMODULE_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.RELEASE_TOKEN }}
          path: pro

      - name: Install gh CLI
        shell: bash
        run: |
          if ! command -v gh &>/dev/null; then
            echo "🔧 gh CLI 未安装，正在安装..."
            choco install gh -y
          fi
          echo "gh version: $(gh --version)"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: 'pnpm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
        env:
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/

      - name: Approve all builds
        run: pnpm approve-builds --all

      - name: Debug Electron Require
        shell: bash
        run: |
          node -e "
          try {
            const path = require('electron');
            const pkgVer = require('electron/package.json').version;
            console.log('Electron Path:', path);
            console.log('Electron Package Version:', pkgVer);
            try {
              const { execSync } = require('child_process');
              const binVer = execSync('\"' + path + '\" --version').toString().trim();
              console.log('Electron Binary Version:', binVer);
            } catch (err) {
              console.log('Electron Binary execution warning:', err.message);
            }
          } catch (e) {
            console.error('Electron Require Failed Error:', e);
            process.exit(1);
          }
          "
        env:
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/

      - name: Set up Visual Studio shell
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure node-gyp MSVS version
        shell: pwsh
        run: |
          $vswhere = Get-Command vswhere.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source
          if (-not $vswhere) {
            $possiblePaths = @(
              "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe",
              "${env:ProgramFiles}\Microsoft Visual Studio\Installer\vswhere.exe"
            )
            $vswhere = $possiblePaths | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $vswhere) { throw "vswhere.exe not found" }
          $vsVer = & $vswhere -latest -property catalog_productLineVersion
          echo "VS Product Line Version: $vsVer"
          echo "GYP_MSVS_VERSION=$vsVer" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Rebuild native dependencies
        run: pnpm run rebuild:all
        env:
          VCINSTALLDIR: ''

      - name: Build extract-file-icon native module (Windows)
        shell: bash
        run: |
          echo "📦 编译 extract-file-icon (面向 Electron)..."
          pnpm run rebuild:extract-file-icon
        env:
          VCINSTALLDIR: ''

      - name: Install Sharp cross-platform dependencies
        run: pnpm run install-sharp-cross-platform

      - name: Create Production Env
        shell: bash
        env:
          ENV_BASE_B64: ${{ secrets.ENV_BASE }}
          ENV_PROD_B64: ${{ secrets.ENV_PROD }}
        run: |
          echo "📝 Injecting environment variables from Base64..."
          echo "$ENV_BASE_B64" | base64 --decode > .env
          echo "$ENV_PROD_B64" | base64 --decode > .env.production
          echo "📄 Showing filtered .env contents:"
          grep -E "VITE_POSTHOG_HOST|SUPABASE_URL" .env || true

      - name: Cache/Restore built-in models
        id: cache-models
        uses: actions/cache@v4
        with:
          path: build/extraResources/models
          key: llama-models-shared-v3

      - name: Download Magika & PP-OCRv6 Models on Cache Miss
        if: steps.cache-models.outputs.cache-hit != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          command -v gh &>/dev/null || { echo "❌ gh CLI 不可用"; exit 1; }
          mkdir -p build/extraResources/models/magika build/extraResources/models/PP-OCRv6
          TEMP_ZIP=$(mktemp)
          echo "📥 从 firefly-resources 下载 magika 与 PP-OCRv6 模型..."
          if gh release download resources --pattern "magika-resources.zip" --repo "Leonard-Li777/firefly-resources" --output "$TEMP_ZIP" --clobber 2>/dev/null; then
            unzip -o -q "$TEMP_ZIP" -d build/extraResources/models/magika
            rm -f "$TEMP_ZIP"
            echo "✅ magika-resources.zip 恢复完成。"
          fi
          if gh release download resources --pattern "ppocrv6-resources.zip" --repo "Leonard-Li777/firefly-resources" --output "$TEMP_ZIP" --clobber 2>/dev/null; then
            unzip -o -q "$TEMP_ZIP" -d build/extraResources/models/PP-OCRv6
            rm -f "$TEMP_ZIP"
            echo "✅ ppocrv6-resources.zip 恢复完成。"
          fi

      - name: Cache/Restore preset resources (fastfetch, llama.cpp)
        id: cache-presets
        uses: actions/cache@v4
        with:
          path: build/presetResources
          key: llama-presets-windows-v2

      - name: Download llama-model-download on Cache Miss
        if: steps.cache-presets.outputs.cache-hit != 'true' || github.event.inputs.download_latest_llama == 'true' || github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/presetResources/llama-model-download
          echo "📥 从 firefly-resources 下载 llama-model-download..."
          gh release download resources --pattern "llama-model-download-*" --repo "Leonard-Li777/firefly-resources" --dir "build/presetResources/llama-model-download" --clobber 2>/dev/null || true
          echo "✅ llama-model-download 资源准备完成。"

      - name: Download fastfetch on Cache Miss (firefly-resources)
        if: steps.cache-presets.outputs.cache-hit != 'true' || github.event.inputs.download_latest_llama == 'true' || github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/presetResources/fastfetch
          echo "📥 从 firefly-resources 下载 fastfetch (Windows)..."
          gh release download resources --pattern "fastfetch-*-win32-x64.zip" --repo "Leonard-Li777/firefly-resources" --dir "build/presetResources/fastfetch" --clobber 2>/dev/null || true
          echo "✅ fastfetch 资源准备完成。"

      - name: Sync Llama.cpp (Bypassed if cache hit and download_latest_llama is false)
        shell: bash
        env:
          DOWNLOAD_LATEST_LLAMA: ${{ github.event.inputs.download_latest_llama || 'true' }}
          FORCE_UPDATE: ${{ github.event.inputs.download_latest_llama || 'true' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ steps.cache-presets.outputs.cache-hit }}" != "true" || "${{ github.event.inputs.download_latest_llama }}" == "true" ]]; then
            echo "📥 Syncing llama.cpp engine..."
            AI_ENGINE=llama.cpp pnpm run download:llama
          fi

      - name: Setup Resources (Basic)
        if: steps.cache-presets.outputs.cache-hit != 'true' || github.event.inputs.download_latest_llama == 'true' || github.event_name == 'push'
        run: pnpm run setup-resources
        env:
          AI_ENGINE: llama.cpp
          FORCE_UPDATE_LLAMACPP: ${{ github.event.inputs.download_latest_llama || 'true' }}

      - name: Download Built-in LFM2.5 Model (firefly-resources)
        if: steps.cache-models.outputs.cache-hit != 'true' || github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          command -v gh &>/dev/null || { echo "❌ gh CLI 不可用"; exit 1; }
          echo "📥 从 firefly-resources 下载内置模型 LFM2.5 1.2B Instruct..."
          TMP_LFM="${RUNNER_TEMP:-/tmp}/lfm"
          mkdir -p "$TMP_LFM"
          if gh release download resources --pattern "LFM2.5-1.2B-Instruct-GGUF--Q4_K_M.zip" --repo "Leonard-Li777/firefly-resources" --dir "$TMP_LFM" --clobber 2>/dev/null; then
            ZIP_FILE=$(find "$TMP_LFM" -name "LFM2.5-1.2B-Instruct-GGUF--Q4_K_M.zip" | head -n 1)
            if [ -n "$ZIP_FILE" ] && [ -f "$ZIP_FILE" ]; then
              mkdir -p build/extraResources/models
              echo "📦 跨平台安全解压内置模型到 build/extraResources/models..."
              python3 -c "import zipfile, os, sys; dest=sys.argv[2]; z=zipfile.ZipFile(sys.argv[1]); [(lambda n, t: [os.remove(t) if os.path.isfile(t) else None, os.makedirs(t, exist_ok=True)] if (m.is_dir() or n.endswith('/') or '.' not in os.path.basename(n)) else [os.remove(os.path.dirname(t)) if os.path.isfile(os.path.dirname(t)) else None, os.makedirs(os.path.dirname(t), exist_ok=True), not os.path.isdir(t) and open(t, 'wb').write(z.read(m))])(m.filename.replace('\\\\\\\\', '/').replace('\\\\', '/').strip('/'), os.path.join(dest, m.filename.replace('\\\\\\\\', '/').replace('\\\\', '/').strip('/'))) for m in z.infolist() if m.filename.strip()]" "$ZIP_FILE" "build/extraResources/models" 2>/dev/null || python -c "import zipfile, os, sys; dest=sys.argv[2]; z=zipfile.ZipFile(sys.argv[1]); [(lambda n, t: [os.remove(t) if os.path.isfile(t) else None, os.makedirs(t, exist_ok=True)] if (m.is_dir() or n.endswith('/') or '.' not in os.path.basename(n)) else [os.remove(os.path.dirname(t)) if os.path.isfile(os.path.dirname(t)) else None, os.makedirs(os.path.dirname(t), exist_ok=True), not os.path.isdir(t) and open(t, 'wb').write(z.read(m))])(m.filename.replace('\\\\\\\\', '/').replace('\\\\', '/').strip('/'), os.path.join(dest, m.filename.replace('\\\\\\\\', '/').replace('\\\\', '/').strip('/'))) for m in z.infolist() if m.filename.strip()]" "$ZIP_FILE" "build/extraResources/models" 2>/dev/null || tar -xf "$ZIP_FILE" -C build/extraResources/models || true
              echo "✅ 内置模型 LFM2.5 1.2B Instruct 恢复完成。"
            fi
            rm -rf "$TMP_LFM"
          else
            echo "⚠️ firefly-resources 未找到内置模型 zip，继续执行 download:builtin-model 兜底。"
          fi

      - name: 下载内置模型并清理投影文件 (llama-model-download)
        if: steps.cache-models.outputs.cache-hit != 'true' || github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          echo "📥 使用 llama-model-download 准备内置模型..."
          pnpm run download:builtin-model

      - name: 下载 firefly-omni 引擎 (firefly-resources)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/extraResources/bin/omni
          echo "📥 从 firefly-resources 下载 firefly-omni (Windows)..."
          TMP_OMNI="/tmp/omni-pkg"
          mkdir -p "$TMP_OMNI"
          DOWNLOADED=false
          for pattern in "firefly-omni-*-win32-x64.zip" "firefly-omni-*-win32-*.zip"; do
            if gh release download resources --pattern "$pattern" --repo "Leonard-Li777/firefly-resources" --dir "$TMP_OMNI" --clobber 2>/dev/null; then
              ARCHIVE=$(find "$TMP_OMNI" -name "firefly-omni-*.zip" 2>/dev/null | head -n 1)
              if [ -n "$ARCHIVE" ] && [ -f "$ARCHIVE" ]; then
                echo "📦 解压 $ARCHIVE 到 build/extraResources/bin/omni..."
                unzip -o -q "$ARCHIVE" -d build/extraResources/bin/omni
                echo "✅ firefly-omni Windows 引擎部署完成。"
                DOWNLOADED=true
                break
              fi
            fi
          done
          rm -rf "$TMP_OMNI"
          if [ "$DOWNLOADED" != "true" ]; then
            echo "⚠️ firefly-resources 暂未检索到 firefly-omni Windows 资产，跳过引擎装配（不阻塞构建）。"
          fi

      - name: 下载 omni-geo 数据集
        shell: bash
        run: |
          echo "📥 从 firefly-resources 下载 omni-geo 地理数据集..."
          mkdir -p build/extraResources/geo
          if gh release download resources --pattern "geo-*.tar.gz" \
            --repo "Leonard-Li777/firefly-resources" --dir "/tmp/geo-pkg" --clobber 2>/dev/null; then
            GEO_ARCHIVE=$(find /tmp/geo-pkg -name "geo-*.tar.gz" 2>/dev/null | head -n 1 || true)
            if [ -n "$GEO_ARCHIVE" ] && [ -f "$GEO_ARCHIVE" ]; then
              tar xzf "$GEO_ARCHIVE" -C build/extraResources/geo
              rm -rf /tmp/geo-pkg
              echo "✅ omni-geo 数据集从 firefly-resources 恢复完成。"
            else
              echo "⚠️ 未在本地目录发现 geo 压缩包，跳过（不阻塞构建）。"
              rm -rf /tmp/geo-pkg
            fi
          else
            echo "⚠️ 未找到 geo 数据集，跳过（不阻塞构建）。"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify extraResources (不多不少门禁)
        shell: bash
        run: |
          echo "🔍 校验最终打包目录 build/extraResources 是否不多不少..."
          node pro/scripts/run.js verify-extra-resources.js --prune

      - name: Copy App Icons
        shell: bash
        run: |
          mkdir -p build assets
          ASSETS_SRC="build/extraResources/assets"
          [ ! -d "$ASSETS_SRC" ] && ASSETS_SRC="assets"
          [ -f "$ASSETS_SRC/icon.ico" ] && cp "$ASSETS_SRC/icon.ico" build/icon.ico && cp "$ASSETS_SRC/icon.ico" assets/icon.ico || true
          [ -f "$ASSETS_SRC/icon.icns" ] && cp "$ASSETS_SRC/icon.icns" build/icon.icns && cp "$ASSETS_SRC/icon.icns" assets/icon.icns || true
          [ -f "$ASSETS_SRC/icon.png" ] && cp "$ASSETS_SRC/icon.png" build/icon.png && cp "$ASSETS_SRC/icon.png" assets/icon.png || true
          if [ "${{ github.event.inputs.build_region }}" = "INTL" ]; then
            cp "$ASSETS_SRC/boot_en.jpg" build/boot.jpg 2>/dev/null || cp "$ASSETS_SRC/boot.jpg" build/boot.jpg 2>/dev/null || true
          else
            cp "$ASSETS_SRC/boot.jpg" build/boot.jpg 2>/dev/null || true
          fi
          [ -f build/boot.jpg ] && cp build/boot.jpg build/boot.gif || true

      - name: Build Windows Application (llama.cpp)
        shell: bash
        run: |
          if [ "${{ github.event.inputs.build_region }}" = "INTL" ]; then
            pnpm run make:intl
          else
            pnpm run make
          fi
        env:
          AI_ENGINE: llama.cpp
          BUILD_REGION: ${{ github.event.inputs.build_region || 'CN' }}

      - name: Verify Windows Release Artifacts (Smoke Test)
        shell: pwsh
        run: |
          Write-Host "🔍 正在检索 out/make 目录下的 Windows 安装包与可执行程序..."
          $installer = Get-ChildItem -Path "out/make" -Filter "*.exe" -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -notmatch "Uninstall" -and ($_.FullName -match "nsis|squirrel|setup" -or $_.Name -match "Setup") } |
            Select-Object -First 1

          if (-not $installer) {
            $installer = Get-ChildItem -Path "out/make" -Filter "*.exe" -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -notmatch "Uninstall" } |
              Select-Object -First 1
          }

          if ($installer) {
            Write-Host "📦 发现 Windows 安装包: $($installer.FullName)"
            $installDir = "C:\TestAppSmoke"
            Write-Host "Executing silent installation to $installDir..."
            $process = Start-Process -FilePath $installer.FullName -ArgumentList "/S", "/D=$installDir" -PassThru -Wait
            Write-Host "Installer exit code: $($process.ExitCode)"
            Start-Sleep -Seconds 5

            $exeCandidate = Get-ChildItem -Path $installDir -Filter "*.exe" -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -notmatch "Uninstall" -and $_.Name -match "firefly" } |
              Select-Object -First 1

            if (-not $exeCandidate) {
              $fallbackDir = Join-Path $env:LOCALAPPDATA "Programs\firefly-ai-folder*"
              $exeCandidate = Get-ChildItem -Path $fallbackDir -Filter "*.exe" -Recurse -ErrorAction SilentlyContinue |
                Where-Object { $_.Name -notmatch "Uninstall" } |
                Select-Object -First 1
            }
          }

          if (-not $exeCandidate) {
            $exeCandidate = Get-ChildItem -Path "out" -Filter "*.exe" -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -notmatch "Uninstall" -and $_.Name -match "firefly" } |
              Select-Object -First 1
          }

          if (-not $exeCandidate) {
            throw "❌ 未能找到可用于 Smoke Test 的 Windows 二进制程序！"
          }

          $exePath = $exeCandidate.FullName
          Write-Host "🎯 目标测试程序路径: $exePath"
          Write-Host "=== 启动应用进行 15s 烟雾健康监测 ==="
          $proc = Start-Process -FilePath $exePath -ArgumentList "--no-sandbox", "--disable-gpu" -PassThru
          Write-Host "Application PID: $($proc.Id). Monitoring process health for 15 seconds..."

          $elapsed = 0
          while ($elapsed -lt 15) {
            Start-Sleep -Seconds 2
            $elapsed += 2
            $proc.Refresh()
            if ($proc.HasExited) {
              throw "❌ Windows 应用程序启动异常崩溃！Exit code: $($proc.ExitCode)"
            }
            Write-Host "  -> Health check at ${elapsed}s: Process alive (Memory: $([math]::Round($proc.WorkingSet64/1MB, 2)) MB)"
          }

          Write-Host "✅ Windows 应用程序通过 15s 烟雾启动稳定性测试！"
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          Write-Host "🎉 Windows 构建产物校验成功，准备执行后续发布！"


      - name: Publish to Cloudflare R2
        shell: bash
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_DOMAIN: ${{ secrets.R2_PUBLIC_DOMAIN }}
        run: |
          echo "📤 Uploading package to Cloudflare R2..."
          pnpm run publish:r2 || echo "⚠️ R2 发布跳过或无配置"

      - name: Publish to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME:-v$(node -p "require('./package.json').version")}"
          echo "🏷️ 当前发布版本 Tag: $TAG"
          gh release view "$TAG" 2>/dev/null || gh release create "$TAG" --title "$TAG" --generate-notes || true

          FILES=()
          while IFS= read -r -d '' f; do
            FILES+=("$f")
          done < <(find out/make -type f \( -name "*.dmg" -o -name "*.pkg" -o -name "*.exe" -o -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" -o -name "*.zip" -o -name "*.tar.gz" -o -name "RELEASES" \) -print0 2>/dev/null)

          if [ ${#FILES[@]} -gt 0 ]; then
            echo "📤 正在上传 ${#FILES[@]} 个构建产物到 GitHub Release ($TAG)..."
            gh release upload "$TAG" "${FILES[@]}" --clobber
            echo "✅ GitHub Release 产物发布成功"
          else
            echo "⚠️ 未在 out/make 目录下找到匹配的安装包产物"
          fi

  build-linux:
    name: Build Linux (${{ matrix.maker }})
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.platform_linux == 'true' || github.event.inputs.platform_linux == true))
    runs-on: ${{ github.event.inputs.linux_runner || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        maker: [deb, rpm]
    container:
      image: node:20-buster
    env:
      NPM_CONFIG_UNSAFE_PERM: 'true'
      PYTHON: python3
      LINUX_MAKER: ${{ matrix.maker }}
    steps:
      - name: Checkout Open-Source Desktop Code
        uses: actions/checkout@v4

      - name: Checkout Private Pro Module
        uses: actions/checkout@v4
        with:
          repository: Leonard-Li777/firefly-ai-folder-desktop-pro
          token: ${{ secrets.PRO_SUBMODULE_TOKEN || secrets.UNISOURCE_RELEASE_TOKEN || secrets.PRIVATE_MONOREPO_PAT || secrets.SUBMODULE_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.RELEASE_TOKEN }}
          path: pro

      - name: Fix buster apt sources (EOL)
        shell: bash
        run: |
          rm -f /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources
          printf '%s\n' \
            'deb http://archive.debian.org/debian buster main contrib non-free' \
            'deb http://archive.debian.org/debian buster-updates main contrib non-free' \
            'deb http://archive.debian.org/debian-security buster/updates main contrib non-free' \
            > /etc/apt/sources.list
          echo 'Acquire::Check-Valid-Until "false";' > /etc/apt/apt.conf.d/99no-check-valid-until
          cat /etc/apt/sources.list

      - name: Install System Build Dependencies (Linux)
        run: |
          apt-get update && apt-get install -y \
            build-essential make g++ python3 fakeroot dpkg rpm libnss3 libnspr4 \
            libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libgtk-3-0 libgbm1 \
            libasound2 libxshmfence1 libx11-xcb1 p7zip-full curl tar

          # 解决 GCC 8.3 不支持 -std=c++20 (仅支持 -std=c++2a) 的兼容性 wrapper
          printf '%s\n' \
            '#!/bin/bash' \
            'args=()' \
            'for arg in "$@"; do' \
            '  if [ "$arg" = "-std=c++20" ]; then' \
            '    args+=("-std=c++2a")' \
            '  else' \
            '    args+=("$arg")' \
            '  fi' \
            'done' \
            'exec /usr/bin/g++ "${args[@]}"' \
            > /usr/local/bin/g++
          chmod +x /usr/local/bin/g++
          ln -sf /usr/local/bin/g++ /usr/local/bin/c++
          ln -sf /usr/local/bin/g++ /usr/local/bin/x86_64-linux-gnu-g++

      - name: Install gh CLI
        shell: bash
        run: |
          if ! command -v gh &>/dev/null; then
            echo "🔧 gh CLI 未安装，正在通过官方静态二进制快速安装..."
            ARCH=$(dpkg --print-architecture 2>/dev/null || uname -m)
            case "$ARCH" in
              aarch64|arm64) GH_ARCH="arm64" ;;
              x86_64|amd64)  GH_ARCH="amd64" ;;
              armv7*|armhf)  GH_ARCH="armv6" ;;
              *)             GH_ARCH="amd64" ;;
            esac

            GH_VER="2.67.0"
            GH_FILE="gh_${GH_VER}_linux_${GH_ARCH}.tar.gz"
            GH_URL="https://github.com/cli/cli/releases/download/v${GH_VER}/${GH_FILE}"

            INSTALLED=false
            mkdir -p /tmp/gh-setup
            for URL in "${GH_URL}" "https://ghfast.top/${GH_URL}" "https://ghproxy.net/${GH_URL}"; do
              echo "📥 尝试从 ${URL} 下载 gh..."
              if curl -fsSL -L --connect-timeout 15 --retry 2 "$URL" -o "/tmp/gh-setup/${GH_FILE}"; then
                tar -xzf "/tmp/gh-setup/${GH_FILE}" -C /tmp/gh-setup
                cp "/tmp/gh-setup/gh_${GH_VER}_linux_${GH_ARCH}/bin/gh" /usr/local/bin/gh 2>/dev/null || \
                cp "/tmp/gh-setup/gh_${GH_VER}_linux_${GH_ARCH}/bin/gh" /usr/bin/gh 2>/dev/null
                chmod +x /usr/local/bin/gh 2>/dev/null || chmod +x /usr/bin/gh 2>/dev/null
                rm -rf /tmp/gh-setup
                INSTALLED=true
                echo "✅ gh CLI 静态二进制已成功安装至 PATH"
                break
              fi
            done
          fi
          echo "gh version: $(gh --version 2>/dev/null || echo '未检测到版本')"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'

      - name: Clean packageManager from package.json
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('./package.json', 'utf8'));
            delete pkg.packageManager;
            fs.writeFileSync('./package.json', JSON.stringify(pkg, null, 2));
          "

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false

      - name: Setup Python (python-build-standalone for buster glibc)
        shell: bash
        run: |
          set -euo pipefail
          echo "🔧 下载 python-build-standalone (manylinux, 最低 glibc 2.17)..."
          TRIPLE="$(uname -m)-unknown-linux-gnu"
          URL="$(
            curl -fsSL "https://api.github.com/repos/astral-sh/python-build-standalone/releases/latest" \
            | TRIPLE="${TRIPLE}" node -e '
                let d = "";
                process.stdin.on("data", (c) => (d += c));
                process.stdin.on("end", () => {
                  const j = JSON.parse(d);
                  const triple = process.env.TRIPLE;
                  const asset = j.assets.find(
                    (a) =>
                      /cpython-3\.11\.[0-9]+/.test(a.name) &&
                      a.name.includes(triple) &&
                      a.name.includes("install_only") &&
                      !a.name.includes("stripped")
                  );
                  if (!asset) {
                    console.error(`未找到 ${triple} 的 Python 3.11 install_only asset`);
                    process.exit(1);
                  }
                  console.log(asset.browser_download_url);
                });
              '
          )"
          mkdir -p /opt/pybs
          curl -fsSL "${URL}" | tar -xz -C /opt/pybs
          echo "/opt/pybs/python/bin" >> "${GITHUB_PATH}"
          /opt/pybs/python/bin/python3 --version

      - name: Override Electron version for Linux compatibility
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const path = './package.json';
            const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
            pkg.devDependencies.electron = '32.2.0';
            fs.writeFileSync(path, JSON.stringify(pkg, null, 2));
          "

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
        env:
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/

      - name: Rebuild native dependencies
        run: |
          pnpm exec electron-rebuild -f -v 32.2.0 -w better-sqlite3
          pnpm exec electron-rebuild -f -v 32.2.0 -w sharp

      - name: Install Sharp cross-platform dependencies
        run: pnpm run install-sharp-cross-platform

      - name: Create Production Env
        shell: bash
        env:
          ENV_BASE_B64: ${{ secrets.ENV_BASE }}
          ENV_PROD_B64: ${{ secrets.ENV_PROD }}
        run: |
          echo "📝 Injecting environment variables from Base64..."
          echo "$ENV_BASE_B64" | base64 --decode > .env
          echo "$ENV_PROD_B64" | base64 --decode > .env.production
          echo "📄 Showing filtered .env contents:"
          grep -E "VITE_POSTHOG_HOST|SUPABASE_URL" .env || true

      - name: Cache/Restore built-in models
        id: cache-models
        uses: actions/cache@v4
        with:
          path: build/extraResources/models
          key: llama-models-shared-v3

      - name: Download Magika & PP-OCRv6 Models on Cache Miss
        if: steps.cache-models.outputs.cache-hit != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          command -v gh &>/dev/null || { echo "❌ gh CLI 不可用"; exit 1; }
          mkdir -p build/extraResources/models/magika build/extraResources/models/PP-OCRv6
          TEMP_ZIP=$(mktemp)
          echo "📥 从 firefly-resources 下载 magika 与 PP-OCRv6 模型..."
          if gh release download resources --pattern "magika-resources.zip" --repo "Leonard-Li777/firefly-resources" --output "$TEMP_ZIP" --clobber 2>/dev/null; then
            unzip -o -q "$TEMP_ZIP" -d build/extraResources/models/magika
            rm -f "$TEMP_ZIP"
            echo "✅ magika-resources.zip 恢复完成。"
          fi
          if gh release download resources --pattern "ppocrv6-resources.zip" --repo "Leonard-Li777/firefly-resources" --output "$TEMP_ZIP" --clobber 2>/dev/null; then
            unzip -o -q "$TEMP_ZIP" -d build/extraResources/models/PP-OCRv6
            rm -f "$TEMP_ZIP"
            echo "✅ ppocrv6-resources.zip 恢复完成。"
          fi

      - name: Cache/Restore preset resources (fastfetch, llama.cpp)
        id: cache-presets
        uses: actions/cache@v4
        with:
          path: build/presetResources
          key: llama-presets-linux-v2

      - name: Download llama-model-download on Cache Miss
        if: steps.cache-presets.outputs.cache-hit != 'true' || github.event.inputs.download_latest_llama == 'true' || github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/presetResources/llama-model-download
          echo "📥 从 firefly-resources 下载 llama-model-download..."
          gh release download resources --pattern "llama-model-download-*" --repo "Leonard-Li777/firefly-resources" --dir "build/presetResources/llama-model-download" --clobber 2>/dev/null || true
          echo "✅ llama-model-download 资源准备完成。"

      - name: Download fastfetch on Cache Miss (firefly-resources)
        if: steps.cache-presets.outputs.cache-hit != 'true' || github.event.inputs.download_latest_llama == 'true' || github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/presetResources/fastfetch
          echo "📥 从 firefly-resources 下载 fastfetch (Linux)..."
          ffarch=x64
          [ "$(uname -m)" = "aarch64" ] || [ "$(uname -m)" = "arm64" ] && ffarch=arm64
          gh release download resources --pattern "fastfetch-*-linux-$ffarch.zip" --repo "Leonard-Li777/firefly-resources" --dir "build/presetResources/fastfetch" --clobber 2>/dev/null || true
          echo "✅ fastfetch 资源准备完成。"

      - name: Sync Llama.cpp (Bypassed if cache hit and download_latest_llama is false)
        shell: bash
        env:
          DOWNLOAD_LATEST_LLAMA: ${{ github.event.inputs.download_latest_llama || 'true' }}
          FORCE_UPDATE: ${{ github.event.inputs.download_latest_llama || 'true' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ steps.cache-presets.outputs.cache-hit }}" != "true" || "${{ github.event.inputs.download_latest_llama }}" == "true" ]]; then
            echo "📥 Syncing llama.cpp engine..."
            AI_ENGINE=llama.cpp pnpm run download:llama
          fi

      - name: Setup Resources (Basic)
        if: steps.cache-presets.outputs.cache-hit != 'true' || github.event.inputs.download_latest_llama == 'true' || github.event_name == 'push'
        run: pnpm run setup-resources
        env:
          AI_ENGINE: llama.cpp
          FORCE_UPDATE_LLAMACPP: ${{ github.event.inputs.download_latest_llama || 'true' }}

      - name: Download Built-in LFM2.5 Model (firefly-resources)
        if: steps.cache-models.outputs.cache-hit != 'true' || github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          command -v gh &>/dev/null || { echo "❌ gh CLI 不可用"; exit 1; }
          echo "📥 从 firefly-resources 下载内置模型 LFM2.5 1.2B Instruct..."
          TMP_LFM="${RUNNER_TEMP:-/tmp}/lfm"
          mkdir -p "$TMP_LFM"
          if gh release download resources --pattern "LFM2.5-1.2B-Instruct-GGUF--Q4_K_M.zip" --repo "Leonard-Li777/firefly-resources" --dir "$TMP_LFM" --clobber 2>/dev/null; then
            ZIP_FILE=$(find "$TMP_LFM" -name "LFM2.5-1.2B-Instruct-GGUF--Q4_K_M.zip" | head -n 1)
            if [ -n "$ZIP_FILE" ] && [ -f "$ZIP_FILE" ]; then
              mkdir -p build/extraResources/models
              echo "📦 跨平台安全解压内置模型到 build/extraResources/models..."
              python3 -c "import zipfile, os, sys; dest=sys.argv[2]; z=zipfile.ZipFile(sys.argv[1]); [(lambda n, t: [os.remove(t) if os.path.isfile(t) else None, os.makedirs(t, exist_ok=True)] if (m.is_dir() or n.endswith('/') or '.' not in os.path.basename(n)) else [os.remove(os.path.dirname(t)) if os.path.isfile(os.path.dirname(t)) else None, os.makedirs(os.path.dirname(t), exist_ok=True), not os.path.isdir(t) and open(t, 'wb').write(z.read(m))])(m.filename.replace('\\\\\\\\', '/').replace('\\\\', '/').strip('/'), os.path.join(dest, m.filename.replace('\\\\\\\\', '/').replace('\\\\', '/').strip('/'))) for m in z.infolist() if m.filename.strip()]" "$ZIP_FILE" "build/extraResources/models" 2>/dev/null || unzip -o -q "$ZIP_FILE" -d build/extraResources/models || true
              echo "✅ 内置模型 LFM2.5 1.2B Instruct 恢复完成。"
            fi
            rm -rf "$TMP_LFM"
          else
            echo "⚠️ firefly-resources 未找到内置模型 zip，继续执行 download:builtin-model 兜底。"
          fi

      - name: 下载内置模型并清理投影文件 (llama-model-download)
        if: steps.cache-models.outputs.cache-hit != 'true' || github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          echo "📥 使用 llama-model-download 准备内置模型..."
          pnpm run download:builtin-model

      - name: 下载 firefly-omni 引擎 (firefly-resources)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/extraResources/bin/omni
          echo "📥 从 firefly-resources 下载 firefly-omni (Linux)..."
          TMP_OMNI="/tmp/omni-pkg"
          mkdir -p "$TMP_OMNI"
          ARCH=$(uname -m)
          DOWNLOADED=false
          case "$ARCH" in
            aarch64|arm64) PATTERNS=("firefly-omni-*-linux-arm64.tar.gz" "firefly-omni-*-linux-*.tar.gz") ;;
            *)             PATTERNS=("firefly-omni-*-linux-x64.tar.gz" "firefly-omni-*-linux-*.tar.gz") ;;
          esac
          for pattern in "${PATTERNS[@]}"; do
            if gh release download resources --pattern "$pattern" --repo "Leonard-Li777/firefly-resources" --dir "$TMP_OMNI" --clobber 2>/dev/null; then
              ARCHIVE=$(find "$TMP_OMNI" -name "firefly-omni-*.tar.gz" 2>/dev/null | head -n 1)
              if [ -n "$ARCHIVE" ] && [ -f "$ARCHIVE" ]; then
                echo "📦 解压 $ARCHIVE 到 build/extraResources/bin/omni..."
                tar -xzf "$ARCHIVE" -C build/extraResources/bin/omni
                chmod +x build/extraResources/bin/omni/firefly-omni 2>/dev/null || true
                echo "✅ firefly-omni Linux 引擎部署完成。"
                DOWNLOADED=true
                break
              fi
            fi
          done
          rm -rf "$TMP_OMNI"
          if [ "$DOWNLOADED" != "true" ]; then
            echo "⚠️ firefly-resources 暂未检索到 firefly-omni Linux 资产，跳过引擎装配（不阻塞构建）。"
          fi

      - name: 下载 omni-geo 数据集
        shell: bash
        run: |
          echo "📥 从 firefly-resources 下载 omni-geo 地理数据集..."
          mkdir -p build/extraResources/geo
          if gh release download resources --pattern "geo-*.tar.gz" \
            --repo "Leonard-Li777/firefly-resources" --dir "/tmp/geo-pkg" --clobber 2>/dev/null; then
            GEO_ARCHIVE=$(find /tmp/geo-pkg -name "geo-*.tar.gz" 2>/dev/null | head -n 1 || true)
            if [ -n "$GEO_ARCHIVE" ] && [ -f "$GEO_ARCHIVE" ]; then
              tar xzf "$GEO_ARCHIVE" -C build/extraResources/geo
              rm -rf /tmp/geo-pkg
              echo "✅ omni-geo 数据集从 firefly-resources 恢复完成。"
            else
              echo "⚠️ 未在本地目录发现 geo 压缩包，跳过（不阻塞构建）。"
              rm -rf /tmp/geo-pkg
            fi
          else
            echo "⚠️ 未找到 geo 数据集，跳过（不阻塞构建）。"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify extraResources (不多不少门禁)
        shell: bash
        run: |
          echo "🔍 校验最终打包目录 build/extraResources 是否不多不少..."
          node pro/scripts/run.js verify-extra-resources.js --prune

      - name: Copy App Icons
        shell: bash
        run: |
          mkdir -p build assets
          ASSETS_SRC="build/extraResources/assets"
          [ ! -d "$ASSETS_SRC" ] && ASSETS_SRC="assets"
          [ -f "$ASSETS_SRC/icon.ico" ] && cp "$ASSETS_SRC/icon.ico" build/icon.ico && cp "$ASSETS_SRC/icon.ico" assets/icon.ico || true
          [ -f "$ASSETS_SRC/icon.icns" ] && cp "$ASSETS_SRC/icon.icns" build/icon.icns && cp "$ASSETS_SRC/icon.icns" assets/icon.icns || true
          [ -f "$ASSETS_SRC/icon.png" ] && cp "$ASSETS_SRC/icon.png" build/icon.png && cp "$ASSETS_SRC/icon.png" assets/icon.png || true
          if [ "${{ github.event.inputs.build_region }}" = "INTL" ]; then
            cp "$ASSETS_SRC/boot_en.jpg" build/boot.jpg 2>/dev/null || cp "$ASSETS_SRC/boot.jpg" build/boot.jpg 2>/dev/null || true
          else
            cp "$ASSETS_SRC/boot.jpg" build/boot.jpg 2>/dev/null || true
          fi
          [ -f build/boot.jpg ] && cp build/boot.jpg build/boot.gif || true

      - name: Build Linux Application (${{ matrix.maker }})
        run: |
          if [ "${{ github.event.inputs.build_region }}" = "INTL" ]; then
            pnpm run make:intl
          else
            pnpm run make
          fi
        env:
          AI_ENGINE: llama.cpp
          BUILD_REGION: ${{ github.event.inputs.build_region || 'CN' }}
          LINUX_MAKER: ${{ matrix.maker }}

      - name: Verify Linux Release Artifacts (Smoke Test)
        shell: bash
        run: |
          echo "🔍 正在安装 Xvfb 及 Linux 运行环境..."
          apt-get update -y && apt-get install -y --no-install-recommends xvfb procps xauth || true

          echo "🔍 正在检索 out/make 目录下的 Linux 构建产物 (${{ matrix.maker }})..."
          TARGET_PKG=$(find out/make -name "*.${{ matrix.maker }}" 2>/dev/null | head -n 1)

          if [ -n "$TARGET_PKG" ] && [ -f "$TARGET_PKG" ]; then
            echo "📦 发现 Linux 安装包: $TARGET_PKG，正在测试安装..."
            if [ "${{ matrix.maker }}" = "deb" ]; then
              dpkg -i "$TARGET_PKG" || apt-get install -f -y
            elif [ "${{ matrix.maker }}" = "rpm" ]; then
              rpm -ivh --nodeps "$TARGET_PKG" || true
            fi
          else
            echo "⚠️ 未在 out/make 找到对应的 ${{ matrix.maker }} 安装包，尝试直接校验解包二进制..."
          fi

          APP_EXEC=$(which firefly-ai-folder 2>/dev/null || which firefly-ai-folder-cn 2>/dev/null || find /opt out /usr/bin -name 'firefly*' -type f -perm /111 2>/dev/null | grep -v "chrome-sandbox" | head -n 1)
          if [ -z "$APP_EXEC" ] || [ ! -x "$APP_EXEC" ]; then
            echo "❌ 未能定位到已安装或生成的 Linux 二进制程序！"
            exit 1
          fi

          echo "🎯 目标测试程序路径: $APP_EXEC"
          echo "=== 启动应用进行 15s 烟雾健康监测 (Xvfb) ==="
          xvfb-run -a "$APP_EXEC" --no-sandbox --disable-gpu --disable-dev-shm-usage > /tmp/linux-smoke.log 2>&1 &
          APP_PID=$!
          echo "Linux Application PID: $APP_PID"

          for i in $(seq 1 8); do
            sleep 2
            if ! kill -0 $APP_PID 2>/dev/null; then
              echo "❌ Linux 应用程序异常崩溃！"
              cat /tmp/linux-smoke.log || true
              exit 1
            fi
            echo "  -> Linux 运行健康检测 at $(($i * 2))s: 进程存活 (glibc & 原生依赖正常)"
          done

          echo "✅ Linux 应用程序通过 15s 烟雾启动稳定性测试！"
          kill -15 $APP_PID 2>/dev/null || kill -9 $APP_PID 2>/dev/null || true
          echo "🎉 Linux 构建产物校验成功，准备执行后续发布！"


      - name: Publish to Cloudflare R2
        shell: bash
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_DOMAIN: ${{ secrets.R2_PUBLIC_DOMAIN }}
        run: |
          echo "📤 Uploading package to Cloudflare R2..."
          pnpm run publish:r2 || echo "⚠️ R2 发布跳过或无配置"

      - name: Publish to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME:-v$(node -p "require('./package.json').version")}"
          echo "🏷️ 当前发布版本 Tag: $TAG"
          gh release view "$TAG" 2>/dev/null || gh release create "$TAG" --title "$TAG" --generate-notes || true

          FILES=()
          while IFS= read -r -d '' f; do
            FILES+=("$f")
          done < <(find out/make -type f \( -name "*.dmg" -o -name "*.pkg" -o -name "*.exe" -o -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" -o -name "*.zip" -o -name "*.tar.gz" -o -name "RELEASES" \) -print0 2>/dev/null)

          if [ ${#FILES[@]} -gt 0 ]; then
            echo "📤 正在上传 ${#FILES[@]} 个构建产物到 GitHub Release ($TAG)..."
            gh release upload "$TAG" "${FILES[@]}" --clobber
            echo "✅ GitHub Release 产物发布成功"
          else
            echo "⚠️ 未在 out/make 目录下找到匹配的安装包产物"
          fi
