name: firefly-ai-folder-desktop-release

on:
  push:
    branches:
      - release
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:
    inputs:
      sha:
        description: '指定构建的精确 Commit SHA (留空则取当前分支 HEAD)'
        required: false
        type: string
        default: ''
      force_rebuild_candidate:
        description: '允许在纯候选态重编同版本号候选包'
        required: false
        type: boolean
        default: false
      platform_macos:
        description: '[仅 master dev 通道生效] 构建 macOS 平台'
        required: false
        type: boolean
        default: true
      platform_windows:
        description: '[仅 master dev 通道生效] 构建 Windows 平台'
        required: false
        type: boolean
        default: true
      platform_linux:
        description: '[仅 master dev 通道生效] 构建 Linux 平台'
        required: false
        type: boolean
        default: true
      download_latest_llama:
        description: '是否重新下载并更新最新的 llama.cpp 核心依赖包 (默认为 true)'
        required: false
        type: boolean
        default: true
      linux_runner:
        description: '选择 Linux 构建的运行 Runner 环境 (默认 ubuntu-latest)'
        required: false
        type: choice
        default: 'ubuntu-latest'
        options:
          - 'ubuntu-latest'
          - 'self-hosted'
      build_region:
        description: '构建区域 (release 通道沿用单母包 dualChannels 输出双清单)'
        required: false
        type: choice
        default: 'CN'
        options:
          - 'CN'
          - 'INTL'

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # ==============================================================================
  # Stage A: Fail-Closed 冻结态预检、Lockfile 校验与通道规划 (plan)
  # ==============================================================================
  plan:
    name: 预检与发布通道规划 (Stage A)
    runs-on: ubuntu-latest
    outputs:
      target_sha: ${{ steps.decide.outputs.target_sha }}
      pkg_version: ${{ steps.decide.outputs.pkg_version }}
      release_tag: ${{ steps.decide.outputs.release_tag }}
      release_channel: ${{ steps.decide.outputs.release_channel }}
      build_windows: ${{ steps.decide.outputs.build_windows }}
      build_macos: ${{ steps.decide.outputs.build_macos }}
      build_linux: ${{ steps.decide.outputs.build_linux }}
      force_rebuild: ${{ steps.decide.outputs.force_rebuild }}
    steps:
      - name: 校验专用凭据非空（严禁回退链）
        shell: bash
        env:
          PRO_TOKEN: ${{ secrets.PRO_SUBMODULE_TOKEN }}
          PROMOTE_TOKEN: ${{ secrets.RELEASE_PROMOTE_TOKEN }}
        run: |
          if [ -z "$PRO_TOKEN" ] || [ -z "$PROMOTE_TOKEN" ]; then
            echo "::error::缺失 PRO_SUBMODULE_TOKEN 或 RELEASE_PROMOTE_TOKEN 专用凭据！"
            exit 1
          fi

      - name: Checkout Open-Source Desktop Code (Full History for Ancestor Check)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 解析 pro gitlink SHA（git ls-tree 四重断言）
        id: resolve_pro
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          ENTRY=$(git ls-tree HEAD pro)
          [ -n "$ENTRY" ] || { echo "::error::未找到 pro gitlink"; exit 1; }
          MODE=$(echo "$ENTRY" | awk '{print $1}')
          TYPE=$(echo "$ENTRY" | awk '{print $2}')
          PRO_SHA=$(echo "$ENTRY" | awk '{print $3}')
          [ "$MODE" = "160000" ] && [ "$TYPE" = "commit" ] && [[ "$PRO_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::pro gitlink 四重断言失败: $ENTRY"; exit 1;
          }
          echo "pro_sha=$PRO_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout Private Pro Module (Pinned to Gitlink SHA)
        uses: actions/checkout@v4
        with:
          repository: Leonard-Li777/firefly-ai-folder-desktop-pro
          token: ${{ secrets.PRO_SUBMODULE_TOKEN }}
          path: pro
          ref: ${{ steps.resolve_pro.outputs.pro_sha }}

      - name: 二次比对 pro HEAD 一致性
        shell: bash
        env:
          EXPECTED_PRO_SHA: ${{ steps.resolve_pro.outputs.pro_sha }}
        run: |
          ACTUAL=$(git -C pro rev-parse HEAD)
          [ "$ACTUAL" = "$EXPECTED_PRO_SHA" ] || { echo "::error::pro HEAD 漂移: $ACTUAL != $EXPECTED_PRO_SHA"; exit 1; }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'

      - name: Fail-Closed 冻结态联合探测与 Lockfile 离线校验
        id: decide
        shell: bash
        env:
          RELEASE_PROMOTE_TOKEN: ${{ secrets.RELEASE_PROMOTE_TOKEN }}
          R2_PUBLIC_BASE: https://download.iocn.cn/firefly-ai-folder
          INPUT_SHA: ${{ github.event.inputs.sha }}
          FORCE_REBUILD: ${{ github.event.inputs.force_rebuild_candidate }}
          INPUT_PLATFORM_WINDOWS: ${{ github.event.inputs.platform_windows }}
          INPUT_PLATFORM_MACOS: ${{ github.event.inputs.platform_macos }}
          INPUT_PLATFORM_LINUX: ${{ github.event.inputs.platform_linux }}
        run: |
          node pro/scripts/ci/plan-freeze-check.js

  build-macos:
    name: Build macOS (${{ matrix.name }})
    needs: [plan]
    if: needs.plan.outputs.build_macos == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 固定使用 macOS 15 镜像：macos-latest 现已指向 macos-26-arm64，
          # 该镜像下 hdiutil/appdmg 行为变化会导致 MakerDMG 在
          # `hdiutil detach /Volumes/<APP>` 处失败（Intel job 使用 macos-15-intel 验证可用）
          - os: macos-15
            arch: arm64
            name: Apple Silicon (arm64)
          - os: macos-15-intel
            arch: x64
            name: Intel (x64)
    steps:
      - name: Checkout Open-Source Desktop Code (Pinned to target_sha)
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.target_sha }}

      - name: 解析 pro gitlink SHA（git ls-tree 四重断言）
        id: resolve_pro
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          ENTRY=$(git ls-tree HEAD pro)
          [ -n "$ENTRY" ] || { echo "::error::未找到 pro gitlink"; exit 1; }
          MODE=$(echo "$ENTRY" | awk '{print $1}')
          TYPE=$(echo "$ENTRY" | awk '{print $2}')
          PRO_SHA=$(echo "$ENTRY" | awk '{print $3}')
          [ "$MODE" = "160000" ] && [ "$TYPE" = "commit" ] && [[ "$PRO_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::pro gitlink 四重断言失败: $ENTRY"; exit 1;
          }
          echo "pro_sha=$PRO_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout Private Pro Module (Pinned to Gitlink SHA)
        uses: actions/checkout@v4
        with:
          repository: Leonard-Li777/firefly-ai-folder-desktop-pro
          token: ${{ secrets.PRO_SUBMODULE_TOKEN }}
          path: pro
          ref: ${{ steps.resolve_pro.outputs.pro_sha }}

      - name: 二次比对 pro HEAD 并按 dev 通道临时注入版本号
        shell: bash
        env:
          EXPECTED_PRO_SHA: ${{ steps.resolve_pro.outputs.pro_sha }}
          RELEASE_CHANNEL: ${{ needs.plan.outputs.release_channel }}
          PKG_VER: ${{ needs.plan.outputs.pkg_version }}
          RUN_NUM: ${{ github.run_number }}
        run: |
          ACTUAL=$(git -C pro rev-parse HEAD)
          [ "$ACTUAL" = "$EXPECTED_PRO_SHA" ] || { echo "::error::pro HEAD 漂移"; exit 1; }
          if [ "$RELEASE_CHANNEL" = "dev" ]; then
            node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version=process.env.PKG_VER+'-dev.'+process.env.RUN_NUM;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');"
          fi

      - name: Install macOS Dependencies
        shell: bash
        run: |
          if ! command -v gh &>/dev/null; then
            echo "🔧 gh CLI 未安装，正在安装..."
            brew install gh
          fi
          echo "gh version: $(gh --version)"

          if ! command -v 7z &>/dev/null; then
            echo "🔧 7z 未安装，正在安装 p7zip..."
            brew install p7zip
          fi
          echo "7z version: $(7z --help 2>&1 | head -2)"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: 'pnpm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
        env:
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/

      - name: Approve all builds
        run: pnpm approve-builds --all

      - name: Ensure Electron Binary Downloaded
        run: pnpm run rebuild:electron-binary || true
        env:
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/

      - name: Debug Electron Require
        shell: bash
        run: |
          node -e "
          try {
            const path = require('electron');
            const pkgVer = require('electron/package.json').version;
            console.log('Electron Path:', path);
            console.log('Electron Package Version:', pkgVer);
            try {
              const { execSync } = require('child_process');
              const binVer = execSync('\"' + path + '\" --version').toString().trim();
              console.log('Electron Binary Version:', binVer);
            } catch (err) {
              console.log('Electron Binary execution warning:', err.message);
            }
          } catch (e) {
            console.error('Electron Require Failed Error:', e);
            process.exit(1);
          }
          "
        env:
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/

      - name: Rebuild native dependencies
        run: pnpm run rebuild:all
        env:
          BUILD_ARCH: ${{ matrix.arch }}

      - name: Install Sharp cross-platform dependencies
        run: pnpm run install-sharp-cross-platform

      - name: Create Production Env
        shell: bash
        env:
          ENV_BASE_B64: ${{ secrets.ENV_BASE }}
          ENV_PROD_B64: ${{ secrets.ENV_PROD }}
        run: |
          echo "📝 Injecting environment variables from Base64..."
          echo "$ENV_BASE_B64" | base64 --decode > .env
          echo "$ENV_PROD_B64" | base64 --decode > .env.production
          echo "📄 Showing filtered .env contents:"
          grep -E "VITE_POSTHOG_HOST|SUPABASE_URL" .env || true

      - name: Cache/Restore preset resources (llama.cpp)
        id: cache-presets
        uses: actions/cache@v4
        with:
          path: build/presetResources
          key: llama-presets-darwin-${{ matrix.arch }}-v3-${{ hashFiles('build/extraResources/configs/preset-resources.lock.json', 'pro/extraResources/configs/preset-resources.lock.json') }}
          restore-keys: |
            llama-presets-darwin-${{ matrix.arch }}-v3-

      - name: Sync Llama.cpp (Bypassed if cache hit and download_latest_llama is false)
        shell: bash
        env:
          DOWNLOAD_LATEST_LLAMA: ${{ github.event.inputs.download_latest_llama || 'true' }}
          FORCE_UPDATE: ${{ github.event.inputs.download_latest_llama || 'true' }}
          GITHUB_TOKEN: ${{ github.token }}
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          if [[ "${{ steps.cache-presets.outputs.cache-hit }}" != "true" || "$DOWNLOAD_LATEST_LLAMA" == "true" || "${{ github.event_name }}" == "push" ]]; then
            echo "📥 Syncing llama.cpp engine for ${{ matrix.arch }}..."
            AI_ENGINE=llama.cpp pnpm run download:llama
          fi
          echo "🔍 [CI 诊断 - macOS] build/presetResources 内容:"
          ls -la build/presetResources || true
          ls -la build/presetResources/llama.cpp || true
          echo "🔍 [CI 诊断 - macOS] build/extraResources/configs/preset-resources.lock.json:"
          cat build/extraResources/configs/preset-resources.lock.json || true

      - name: Fetch published chinese-clip package (consume only, fail-closed)
        shell: bash
        run: |
          # chinese-clip 属 L 轨（文本塔 + gemma 四件套无下载链路，只有本地烘得出来）。
          # CI 不得重建：本步按 build/extraResources/configs/resources.bom.json 声明的
          # name/sha256/size 取**已发布**包并逐字校验，缺失或摘要不符即失败退出。
          # 严禁给本步加 `|| true` —— 那会把「取到旧代资产」伪装成「构建成功」。
          echo "📦 拉取已发布的 chinese-clip 明文包（不允许本地重建）..."
          node pro/scripts/run.js fetch-clip-resources.js
        env:
          GH_TOKEN: ${{ secrets.UNISOURCE_RELEASE_TOKEN || secrets.PRO_SUBMODULE_TOKEN || secrets.PRIVATE_MONOREPO_PAT || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Prepare public multimodal resources (monorepo-only, best-effort)
        shell: bash
        run: |
          echo "📦 检查并准备公开多模态预置资源..."
          # 公开模型（mobile-clip / nsfw-tiny / sensevoice-small / audio-cpp）可公开下载，
          # 但产包脚本只存在于 monorepo 根 scripts/，desktop 仓库 checkout 内没有它。
          # 因此这里显式判存在再执行，不做 `|| true` 静默掩蔽。
          if [[ -f scripts/download-multimodal-resources.js ]]; then
            node scripts/download-multimodal-resources.js --resource mobile-clip,nsfw-tiny,sensevoice-small,audio-cpp
          else
            echo "ℹ️ 本 checkout 不含 monorepo 的 scripts/：公开模型资源由 actions/cache 提供。"
            echo "   冷缓存场景请在 monorepo 执行 pnpm download:multimodal 后发布，再重跑发布流水线。"
          fi
        env:
          GH_TOKEN: ${{ secrets.UNISOURCE_RELEASE_TOKEN || secrets.PRO_SUBMODULE_TOKEN || secrets.PRIVATE_MONOREPO_PAT || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Resources (Basic)
        shell: bash
        run: |
          echo "🔍 [CI 诊断 - macOS] 执行 setup-resources 前的 build/presetResources/llama.cpp:"
          ls -la build/presetResources/llama.cpp || true
          pnpm run setup-resources
          echo "🔍 [CI 诊断 - macOS] 执行 setup-resources 后的 build/extraResources/bin:"
          ls -la build/extraResources/bin || true
        env:
          AI_ENGINE: llama.cpp
          BUILD_ARCH: ${{ matrix.arch }}
          FORCE_UPDATE_LLAMACPP: ${{ github.event.inputs.download_latest_llama || 'true' }}
          GH_TOKEN: ${{ secrets.UNISOURCE_RELEASE_TOKEN || secrets.PRO_SUBMODULE_TOKEN || secrets.PRIVATE_MONOREPO_PAT || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Verify extraResources (不多不少门禁)
        shell: bash
        env:
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          echo "🔍 校验最终打包目录 build/extraResources 是否不多不少..."
          node pro/scripts/run.js verify-extra-resources.js --prune

      - name: Copy App Icons
        shell: bash
        run: |
          mkdir -p build assets
          ASSETS_SRC="build/extraResources/assets"
          [ ! -d "$ASSETS_SRC" ] && ASSETS_SRC="assets"
          [ -f "$ASSETS_SRC/icon.ico" ] && cp "$ASSETS_SRC/icon.ico" build/icon.ico && cp "$ASSETS_SRC/icon.ico" assets/icon.ico || true
          [ -f "$ASSETS_SRC/icon.icns" ] && cp "$ASSETS_SRC/icon.icns" build/icon.icns && cp "$ASSETS_SRC/icon.icns" assets/icon.icns || true
          [ -f "$ASSETS_SRC/icon.png" ] && cp "$ASSETS_SRC/icon.png" build/icon.png && cp "$ASSETS_SRC/icon.png" assets/icon.png || true
          if [ "${{ github.event.inputs.build_region }}" = "INTL" ]; then
            cp "$ASSETS_SRC/boot_en.jpg" build/boot.jpg 2>/dev/null || cp "$ASSETS_SRC/boot.jpg" build/boot.jpg 2>/dev/null || true
          else
            cp "$ASSETS_SRC/boot.jpg" build/boot.jpg 2>/dev/null || true
          fi
          [ -f build/boot.jpg ] && cp build/boot.jpg build/boot.gif || true

      - name: Build macOS Application (llama.cpp)
        run: |
          if [ "${{ github.event.inputs.build_region }}" = "INTL" ]; then
            pnpm run make:intl
          else
            pnpm run make
          fi
        env:
          AI_ENGINE: llama.cpp
          BUILD_REGION: ${{ github.event.inputs.build_region || 'CN' }}
          BUILD_ARCH: ${{ matrix.arch }}

      - name: Verify macOS Release Artifacts (Smoke Test)
        shell: bash
        run: |
          echo "🔍 正在检索 out/make 目录下的 macOS 构建产物..."
          DMG_FILE=$(find out/make -name "*.dmg" 2>/dev/null | head -n 1)
          if [ -z "$DMG_FILE" ] || [ ! -f "$DMG_FILE" ]; then
            echo "⚠️ 未在 out/make 找到 .dmg 文件，尝试查找 .app 解包产物..."
            APP_CANDIDATE=$(find out -name "*.app" -type d 2>/dev/null | head -n 1)
            if [ -z "$APP_CANDIDATE" ]; then
              echo "❌ 未找到可测试的 macOS 产物！"
              exit 1
            fi
            MOUNT_CLEANUP=false
            LOCAL_APP="$APP_CANDIDATE"
          else
            echo "📦 找到安装包: $DMG_FILE，正在挂载测试..."
            MOUNT_DIR="/tmp/FireflyBuildMount"
            mkdir -p "$MOUNT_DIR"
            hdiutil attach "$DMG_FILE" -mountpoint "$MOUNT_DIR" -nobrowse
            
            APP_NAME=$(ls -d "$MOUNT_DIR"/*.app 2>/dev/null | head -n 1)
            if [ -z "$APP_NAME" ]; then
              echo "❌ DMG 镜像内未找到 .app bundle！"
              hdiutil detach "$MOUNT_DIR" || true
              exit 1
            fi
            
            echo "Found app bundle inside DMG: $APP_NAME"
            mkdir -p /tmp/FireflyTestExtract
            cp -R "$APP_NAME" /tmp/FireflyTestExtract/
            hdiutil detach "$MOUNT_DIR" || true
            LOCAL_APP="/tmp/FireflyTestExtract/$(basename "$APP_NAME")"
          fi

          echo "Removing quarantine attributes on $LOCAL_APP..."
          xattr -dr com.apple.quarantine "$LOCAL_APP" 2>/dev/null || true

          BIN_PATH=$(find "$LOCAL_APP/Contents/MacOS" -type f -perm +111 2>/dev/null | head -n 1)
          if [ -z "$BIN_PATH" ]; then
            echo "❌ 未找到 App 可执行二进制文件！"
            exit 1
          fi

          echo "🎯 可执行文件路径: $BIN_PATH"
          echo "=== [1/2] 检查二进制架构 ==="
          lipo -info "$BIN_PATH" || file "$BIN_PATH"

          # 启动烟雾测试 (15s)
          ARCH_FLAG="${{ matrix.arch == 'arm64' && '-arm64' || '-x86_64' }}"
          echo "=== [2/2] 测试应用启动 (15s 烟雾测试: $ARCH_FLAG) ==="
          arch $ARCH_FLAG "$BIN_PATH" --no-sandbox --disable-gpu > /tmp/app-smoke.log 2>&1 &
          APP_PID=$!
          echo "Process PID: $APP_PID"
          for i in {1..8}; do
            sleep 2
            if ! kill -0 $APP_PID 2>/dev/null; then
              echo "❌ 应用启动失败或崩溃！"
              cat /tmp/app-smoke.log || true
              exit 1
            fi
            echo "  -> 运行健康检测 at $((i*2))s: 进程存活"
          done
          kill -15 $APP_PID 2>/dev/null || kill -9 $APP_PID 2>/dev/null || true
          echo "✅ 15s 启动烟雾测试通过！"

          echo "🎉 macOS (${{ matrix.arch }}) 构建产物全部通过安装与启动验证，准备执行发布！"

      - name: Generate Channel Update Manifest (macOS)
        shell: bash
        env:
          BUILD_REGION: ${{ github.event.inputs.build_region || 'CN' }}
        run: |
          echo "📝 生成自动更新渠道清单..."
          node pro/scripts/run.js generate-channel-manifest.js --assert-isolation

      - name: Publish Candidate to Cloudflare R2 (Fail-Fast)
        if: needs.plan.outputs.release_channel == 'candidate'
        shell: bash
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_DOMAIN: ${{ secrets.R2_PUBLIC_DOMAIN }}
          RELEASE_VERSION: ${{ needs.plan.outputs.pkg_version }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          echo "📤 Uploading macOS candidate artifacts to R2 candidates/..."
          pnpm run publish:r2

      - name: Upload Dev Artifacts (Skip R2)
        if: needs.plan.outputs.release_channel == 'dev'
        uses: actions/upload-artifact@v4
        with:
          name: dev-macos-${{ matrix.arch }}
          retention-days: 7
          path: |
            out/make/**/*.dmg
            out/make/**/*.zip
            out/make/**/*.blockmap
            out/make/**/*.yml

  build-windows:
    name: Build Windows
    needs: [plan]
    if: needs.plan.outputs.build_windows == 'true'
    runs-on: windows-2022
    steps:
      - name: Checkout Open-Source Desktop Code (Pinned to target_sha)
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.target_sha }}

      - name: 解析 pro gitlink SHA（git ls-tree 四重断言）
        id: resolve_pro
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          ENTRY=$(git ls-tree HEAD pro)
          [ -n "$ENTRY" ] || { echo "::error::未找到 pro gitlink"; exit 1; }
          MODE=$(echo "$ENTRY" | awk '{print $1}')
          TYPE=$(echo "$ENTRY" | awk '{print $2}')
          PRO_SHA=$(echo "$ENTRY" | awk '{print $3}')
          [ "$MODE" = "160000" ] && [ "$TYPE" = "commit" ] && [[ "$PRO_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::pro gitlink 四重断言失败: $ENTRY"; exit 1;
          }
          echo "pro_sha=$PRO_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout Private Pro Module (Pinned to Gitlink SHA)
        uses: actions/checkout@v4
        with:
          repository: Leonard-Li777/firefly-ai-folder-desktop-pro
          token: ${{ secrets.PRO_SUBMODULE_TOKEN }}
          path: pro
          ref: ${{ steps.resolve_pro.outputs.pro_sha }}

      - name: 二次比对 pro HEAD 并按 dev 通道临时注入版本号
        shell: bash
        env:
          EXPECTED_PRO_SHA: ${{ steps.resolve_pro.outputs.pro_sha }}
          RELEASE_CHANNEL: ${{ needs.plan.outputs.release_channel }}
          PKG_VER: ${{ needs.plan.outputs.pkg_version }}
          RUN_NUM: ${{ github.run_number }}
        run: |
          ACTUAL=$(git -C pro rev-parse HEAD)
          [ "$ACTUAL" = "$EXPECTED_PRO_SHA" ] || { echo "::error::pro HEAD 漂移"; exit 1; }
          if [ "$RELEASE_CHANNEL" = "dev" ]; then
            node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version=process.env.PKG_VER+'-dev.'+process.env.RUN_NUM;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');"
          fi

      - name: Install gh CLI
        shell: bash
        run: |
          if ! command -v gh &>/dev/null; then
            echo "🔧 gh CLI 未安装，正在安装..."
            choco install gh -y
          fi
          echo "gh version: $(gh --version)"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: 'pnpm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
        env:
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/

      - name: Approve all builds
        run: pnpm approve-builds --all

      - name: Debug Electron Require
        shell: bash
        run: |
          node -e "
          try {
            const path = require('electron');
            const pkgVer = require('electron/package.json').version;
            console.log('Electron Path:', path);
            console.log('Electron Package Version:', pkgVer);
            try {
              const { execSync } = require('child_process');
              const binVer = execSync('\"' + path + '\" --version').toString().trim();
              console.log('Electron Binary Version:', binVer);
            } catch (err) {
              console.log('Electron Binary execution warning:', err.message);
            }
          } catch (e) {
            console.error('Electron Require Failed Error:', e);
            process.exit(1);
          }
          "
        env:
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/

      - name: Set up Visual Studio shell
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure node-gyp MSVS version
        shell: pwsh
        run: |
          $vswhere = Get-Command vswhere.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source
          if (-not $vswhere) {
            $possiblePaths = @(
              "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe",
              "${env:ProgramFiles}\Microsoft Visual Studio\Installer\vswhere.exe"
            )
            $vswhere = $possiblePaths | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $vswhere) { throw "vswhere.exe not found" }
          $vsVer = & $vswhere -latest -property catalog_productLineVersion
          echo "VS Product Line Version: $vsVer"
          echo "GYP_MSVS_VERSION=$vsVer" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Rebuild native dependencies
        run: pnpm run rebuild:all
        env:
          VCINSTALLDIR: ''

      - name: Build extract-file-icon native module (Windows)
        shell: bash
        run: |
          echo "📦 编译 extract-file-icon (面向 Electron)..."
          pnpm run rebuild:extract-file-icon
        env:
          VCINSTALLDIR: ''

      - name: Install Sharp cross-platform dependencies
        run: pnpm run install-sharp-cross-platform

      - name: Create Production Env
        shell: bash
        env:
          ENV_BASE_B64: ${{ secrets.ENV_BASE }}
          ENV_PROD_B64: ${{ secrets.ENV_PROD }}
        run: |
          echo "📝 Injecting environment variables from Base64..."
          echo "$ENV_BASE_B64" | base64 --decode > .env
          echo "$ENV_PROD_B64" | base64 --decode > .env.production
          echo "📄 Showing filtered .env contents:"
          grep -E "VITE_POSTHOG_HOST|SUPABASE_URL" .env || true

      - name: Cache/Restore preset resources (llama.cpp)
        id: cache-presets
        uses: actions/cache@v4
        with:
          path: build/presetResources
          key: llama-presets-windows-v3-${{ hashFiles('build/extraResources/configs/preset-resources.lock.json', 'pro/extraResources/configs/preset-resources.lock.json') }}
          restore-keys: |
            llama-presets-windows-v3-

      - name: Sync Llama.cpp (Bypassed if cache hit and download_latest_llama is false)
        shell: bash
        env:
          DOWNLOAD_LATEST_LLAMA: ${{ github.event.inputs.download_latest_llama || 'true' }}
          FORCE_UPDATE: ${{ github.event.inputs.download_latest_llama || 'true' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ steps.cache-presets.outputs.cache-hit }}" != "true" || "$DOWNLOAD_LATEST_LLAMA" == "true" || "${{ github.event_name }}" == "push" ]]; then
            echo "📥 Syncing llama.cpp engine..."
            AI_ENGINE=llama.cpp pnpm run download:llama
          fi
          echo "🔍 [CI 诊断 - Windows] build/presetResources 内容:"
          ls -la build/presetResources || true
          ls -la build/presetResources/llama.cpp || true
          echo "🔍 [CI 诊断 - Windows] build/extraResources/configs/preset-resources.lock.json:"
          cat build/extraResources/configs/preset-resources.lock.json || true

      - name: Fetch published chinese-clip package (consume only, fail-closed)
        shell: bash
        run: |
          # chinese-clip 属 L 轨（文本塔 + gemma 四件套无下载链路，只有本地烘得出来）。
          # CI 不得重建：本步按 build/extraResources/configs/resources.bom.json 声明的
          # name/sha256/size 取**已发布**包并逐字校验，缺失或摘要不符即失败退出。
          # 严禁给本步加 `|| true` —— 那会把「取到旧代资产」伪装成「构建成功」。
          echo "📦 拉取已发布的 chinese-clip 明文包（不允许本地重建）..."
          node pro/scripts/run.js fetch-clip-resources.js
        env:
          GH_TOKEN: ${{ secrets.UNISOURCE_RELEASE_TOKEN || secrets.PRO_SUBMODULE_TOKEN || secrets.PRIVATE_MONOREPO_PAT || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Prepare public multimodal resources (monorepo-only, best-effort)
        shell: bash
        run: |
          echo "📦 检查并准备公开多模态预置资源..."
          # 公开模型（mobile-clip / nsfw-tiny / sensevoice-small / audio-cpp）可公开下载，
          # 但产包脚本只存在于 monorepo 根 scripts/，desktop 仓库 checkout 内没有它。
          # 因此这里显式判存在再执行，不做 `|| true` 静默掩蔽。
          if [[ -f scripts/download-multimodal-resources.js ]]; then
            node scripts/download-multimodal-resources.js --resource mobile-clip,nsfw-tiny,sensevoice-small,audio-cpp
          else
            echo "ℹ️ 本 checkout 不含 monorepo 的 scripts/：公开模型资源由 actions/cache 提供。"
            echo "   冷缓存场景请在 monorepo 执行 pnpm download:multimodal 后发布，再重跑发布流水线。"
          fi
        env:
          GH_TOKEN: ${{ secrets.UNISOURCE_RELEASE_TOKEN || secrets.PRO_SUBMODULE_TOKEN || secrets.PRIVATE_MONOREPO_PAT || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Resources (Basic)
        shell: bash
        run: |
          echo "🔍 [CI 诊断 - Windows] 执行 setup-resources 前的 build/presetResources/llama.cpp:"
          ls -la build/presetResources/llama.cpp || true
          pnpm run setup-resources
          echo "🔍 [CI 诊断 - Windows] 执行 setup-resources 后的 build/extraResources/bin:"
          ls -la build/extraResources/bin || true
        env:
          AI_ENGINE: llama.cpp
          FORCE_UPDATE_LLAMACPP: ${{ github.event.inputs.download_latest_llama || 'true' }}
          GH_TOKEN: ${{ secrets.UNISOURCE_RELEASE_TOKEN || secrets.PRO_SUBMODULE_TOKEN || secrets.PRIVATE_MONOREPO_PAT || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Verify extraResources (不多不少门禁)
        shell: bash
        run: |
          echo "🔍 校验最终打包目录 build/extraResources 是否不多不少..."
          node pro/scripts/run.js verify-extra-resources.js --prune

      - name: Copy App Icons
        shell: bash
        run: |
          mkdir -p build assets
          ASSETS_SRC="build/extraResources/assets"
          [ ! -d "$ASSETS_SRC" ] && ASSETS_SRC="assets"
          [ -f "$ASSETS_SRC/icon.ico" ] && cp "$ASSETS_SRC/icon.ico" build/icon.ico && cp "$ASSETS_SRC/icon.ico" assets/icon.ico || true
          [ -f "$ASSETS_SRC/icon.icns" ] && cp "$ASSETS_SRC/icon.icns" build/icon.icns && cp "$ASSETS_SRC/icon.icns" assets/icon.icns || true
          [ -f "$ASSETS_SRC/icon.png" ] && cp "$ASSETS_SRC/icon.png" build/icon.png && cp "$ASSETS_SRC/icon.png" assets/icon.png || true
          if [ "${{ github.event.inputs.build_region }}" = "INTL" ]; then
            cp "$ASSETS_SRC/boot_en.jpg" build/boot.jpg 2>/dev/null || cp "$ASSETS_SRC/boot.jpg" build/boot.jpg 2>/dev/null || true
          else
            cp "$ASSETS_SRC/boot.jpg" build/boot.jpg 2>/dev/null || true
          fi
          [ -f build/boot.jpg ] && cp build/boot.jpg build/boot.gif || true

      - name: Build Windows Application (llama.cpp)
        shell: bash
        run: |
          if [ "${{ github.event.inputs.build_region }}" = "INTL" ]; then
            pnpm run make:intl
          else
            pnpm run make
          fi
        env:
          AI_ENGINE: llama.cpp
          BUILD_REGION: ${{ github.event.inputs.build_region || 'CN' }}

      - name: Verify Windows Release Artifacts (Smoke Test)
        shell: pwsh
        run: |
          Write-Host "🔍 正在检索 out/make 目录下的 Windows 安装包与可执行程序..."
          $installer = Get-ChildItem -Path "out/make" -Filter "*.exe" -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -notmatch "Uninstall" -and ($_.FullName -match "nsis|squirrel|setup" -or $_.Name -match "Setup") } |
            Select-Object -First 1

          if (-not $installer) {
            $installer = Get-ChildItem -Path "out/make" -Filter "*.exe" -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -notmatch "Uninstall" } |
              Select-Object -First 1
          }

          if ($installer) {
            Write-Host "📦 发现 Windows 安装包: $($installer.FullName)"
            $installDir = "C:\TestAppSmoke"
            Write-Host "Executing silent installation to $installDir..."
            $process = Start-Process -FilePath $installer.FullName -ArgumentList "/S", "/D=$installDir" -PassThru -Wait
            Write-Host "Installer exit code: $($process.ExitCode)"
            Start-Sleep -Seconds 5

            $exeCandidate = Get-ChildItem -Path $installDir -Filter "*.exe" -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -notmatch "Uninstall" -and $_.Name -match "firefly" } |
              Select-Object -First 1

            if (-not $exeCandidate) {
              $fallbackDir = Join-Path $env:LOCALAPPDATA "Programs\firefly-ai-folder*"
              $exeCandidate = Get-ChildItem -Path $fallbackDir -Filter "*.exe" -Recurse -ErrorAction SilentlyContinue |
                Where-Object { $_.Name -notmatch "Uninstall" } |
                Select-Object -First 1
            }
          }

          if (-not $exeCandidate) {
            $exeCandidate = Get-ChildItem -Path "out" -Filter "*.exe" -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -notmatch "Uninstall" -and $_.Name -match "firefly" } |
              Select-Object -First 1
          }

          if (-not $exeCandidate) {
            throw "❌ 未能找到可用于 Smoke Test 的 Windows 二进制程序！"
          }

          $exePath = $exeCandidate.FullName
          Write-Host "🎯 目标测试程序路径: $exePath"
          Write-Host "=== 启动应用进行 15s 烟雾健康监测 ==="
          $proc = Start-Process -FilePath $exePath -ArgumentList "--no-sandbox", "--disable-gpu" -PassThru
          Write-Host "Application PID: $($proc.Id). Monitoring process health for 15 seconds..."

          $elapsed = 0
          while ($elapsed -lt 15) {
            Start-Sleep -Seconds 2
            $elapsed += 2
            $proc.Refresh()
            if ($proc.HasExited) {
              throw "❌ Windows 应用程序启动异常崩溃！Exit code: $($proc.ExitCode)"
            }
            Write-Host "  -> Health check at ${elapsed}s: Process alive (Memory: $([math]::Round($proc.WorkingSet64/1MB, 2)) MB)"
          }

          Write-Host "✅ Windows 应用程序通过 15s 烟雾启动稳定性测试！"
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          Write-Host "🎉 Windows 构建产物校验成功，准备执行后续发布！"

      - name: Generate Channel Update Manifest (Windows)
        shell: bash
        env:
          BUILD_REGION: ${{ github.event.inputs.build_region || 'CN' }}
        run: |
          echo "📝 生成包含 blockMapSize 的自动更新渠道清单与在线引导器 INI..."
          node pro/scripts/run.js generate-channel-manifest.js --assert-isolation
          node pro/scripts/run.js verify-blockmap-gate.js

      - name: Setup Inno Setup & Build Stubs
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup --no-progress -y
          }
          if (-not (Test-Path "build/idp.iss")) {
            Write-Host "📥 正在下载 InnoDownloadPlugin (IDP)..."
            Invoke-WebRequest -Uri "https://github.com/mitrichsoftware/innodownloadplugin/releases/download/v1.5.1/idp-1.5.1.zip" -OutFile "idp.zip"
            Expand-Archive "idp.zip" -DestinationPath "build" -Force
          }

          $version = node -p "require('./package.json').version"
          $outDir = (Resolve-Path "out/make").Path

          # 寻找编译好的全量母包并计算 SHA-256
          $motherPkg = Get-ChildItem -Path "$outDir" -Filter "firefly-ai-folder-$version-setup-full-*.exe" | Select-Object -First 1
          if (-not $motherPkg) {
            $motherPkg = Get-ChildItem -Path "$outDir" -Recurse -Filter "firefly-ai-folder-*-setup-full-*.exe" | Select-Object -First 1
          }
          if (-not $motherPkg) {
            $motherPkg = Get-ChildItem -Path "$outDir" -Recurse -Filter "*.exe" | Where-Object { $_.Name -notmatch "Setup-" -and $_.Name -match "firefly-ai-folder" } | Select-Object -First 1
          }

          $motherHash = ""
          $motherFileName = "firefly-ai-folder-$version-setup-full-x64.exe"
          if ($motherPkg) {
            $motherFileName = $motherPkg.Name
            $motherHash = (Get-FileHash -Path $motherPkg.FullName -Algorithm SHA256).Hash.ToLower()
            Write-Host "🔒 锁定母包文件名: $motherFileName"
            Write-Host "🔒 锁定母包 SHA-256: $motherHash"
          } else {
            Write-Warning "⚠️ 未能在本地找到母包，引导器将依赖在线清单拉取"
          }

          # 编译国内版引导器 (带最新版本在线探测 + 构建时回退)
          iscc `
            /DAPP_REGION=CN `
            /DSHORTCUT_NAME="萤核智能文件夹" `
            /DMANIFEST_URL="https://download.iocn.cn/firefly-ai-folder/latest-cn.ini" `
            /DFALLBACK_DOWNLOAD_URL="https://download.iocn.cn/firefly-ai-folder/$version/$motherFileName" `
            /DFALLBACK_SHA256="$motherHash" `
            /O"$outDir" `
            /F"Firefly-AI-Folder-Setup-CN" `
            build/stub-installer.iss

          # 编译海外版引导器 (带最新版本在线探测 + 构建时回退)
          iscc `
            /DAPP_REGION=GLOBAL `
            /DSHORTCUT_NAME="Firefly AI folder" `
            /DMANIFEST_URL="https://download.iocn.cn/firefly-ai-folder/latest-global.ini" `
            /DFALLBACK_DOWNLOAD_URL="https://download.iocn.cn/firefly-ai-folder/$version/$motherFileName" `
            /DFALLBACK_SHA256="$motherHash" `
            /O"$outDir" `
            /F"Firefly-AI-Folder-Setup-Global" `
            build/stub-installer.iss

          Write-Host "✅ 在线引导安装器编译完成！"

      - name: Publish Candidate to Cloudflare R2 (Fail-Fast)
        if: needs.plan.outputs.release_channel == 'candidate'
        shell: bash
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_DOMAIN: ${{ secrets.R2_PUBLIC_DOMAIN }}
          RELEASE_VERSION: ${{ needs.plan.outputs.pkg_version }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          echo "📤 Uploading Windows candidate artifacts to R2 candidates/..."
          pnpm run publish:r2

      - name: Upload Dev Artifacts (Skip R2)
        if: needs.plan.outputs.release_channel == 'dev'
        uses: actions/upload-artifact@v4
        with:
          name: dev-windows
          retention-days: 7
          path: |
            out/make/**/*.exe
            out/make/**/*.blockmap
            out/make/**/*.yml
            out/make/**/*.ini

  build-linux:
    name: Build Linux (${{ matrix.maker }})
    needs: [plan]
    if: needs.plan.outputs.build_linux == 'true'
    runs-on: ${{ github.event.inputs.linux_runner || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        maker: [deb, rpm]
    container:
      # Debian 12 (bookworm, glibc 2.36)：满足 firefly-omni 引擎的 glibc 2.34+ 要求，
      # omni 引擎在打包产物中完整可用（老系统 Debian 10/11 已不再支持）
      image: node:20-bookworm
    env:
      NPM_CONFIG_UNSAFE_PERM: 'true'
      PYTHON: python3
      LINUX_MAKER: ${{ matrix.maker }}
    steps:
      - name: Checkout Open-Source Desktop Code (Pinned to target_sha)
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.target_sha }}

      - name: 解析 pro gitlink SHA（git ls-tree 四重断言）
        id: resolve_pro
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          ENTRY=$(git ls-tree HEAD pro)
          [ -n "$ENTRY" ] || { echo "::error::未找到 pro gitlink"; exit 1; }
          MODE=$(echo "$ENTRY" | awk '{print $1}')
          TYPE=$(echo "$ENTRY" | awk '{print $2}')
          PRO_SHA=$(echo "$ENTRY" | awk '{print $3}')
          [ "$MODE" = "160000" ] && [ "$TYPE" = "commit" ] && [[ "$PRO_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::pro gitlink 四重断言失败: $ENTRY"; exit 1;
          }
          echo "pro_sha=$PRO_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout Private Pro Module (Pinned to Gitlink SHA)
        uses: actions/checkout@v4
        with:
          repository: Leonard-Li777/firefly-ai-folder-desktop-pro
          token: ${{ secrets.PRO_SUBMODULE_TOKEN }}
          path: pro
          ref: ${{ steps.resolve_pro.outputs.pro_sha }}

      - name: 二次比对 pro HEAD 并按 dev 通道临时注入版本号
        shell: bash
        env:
          EXPECTED_PRO_SHA: ${{ steps.resolve_pro.outputs.pro_sha }}
          RELEASE_CHANNEL: ${{ needs.plan.outputs.release_channel }}
          PKG_VER: ${{ needs.plan.outputs.pkg_version }}
          RUN_NUM: ${{ github.run_number }}
        run: |
          ACTUAL=$(git -C pro rev-parse HEAD)
          [ "$ACTUAL" = "$EXPECTED_PRO_SHA" ] || { echo "::error::pro HEAD 漂移"; exit 1; }
          if [ "$RELEASE_CHANNEL" = "dev" ]; then
            node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version=process.env.PKG_VER+'-dev.'+process.env.RUN_NUM;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');"
          fi

      - name: Install System Build Dependencies (Linux)
        run: |
          apt-get update && apt-get install -y \
            build-essential make g++ python3 fakeroot dpkg rpm libnss3 libnspr4 \
            libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libgtk-3-0 libgbm1 \
            libasound2 libxshmfence1 libx11-xcb1 p7zip-full curl tar

      - name: Install gh CLI
        shell: bash
        run: |
          if ! command -v gh &>/dev/null; then
            echo "🔧 gh CLI 未安装，正在通过官方静态二进制快速安装..."
            ARCH=$(dpkg --print-architecture 2>/dev/null || uname -m)
            case "$ARCH" in
              aarch64|arm64) GH_ARCH="arm64" ;;
              x86_64|amd64)  GH_ARCH="amd64" ;;
              armv7*|armhf)  GH_ARCH="armv6" ;;
              *)             GH_ARCH="amd64" ;;
            esac

            GH_VER="2.67.0"
            GH_FILE="gh_${GH_VER}_linux_${GH_ARCH}.tar.gz"
            GH_URL="https://github.com/cli/cli/releases/download/v${GH_VER}/${GH_FILE}"

            INSTALLED=false
            mkdir -p /tmp/gh-setup
            for URL in "${GH_URL}" "https://ghfast.top/${GH_URL}" "https://ghproxy.net/${GH_URL}"; do
              echo "📥 尝试从 ${URL} 下载 gh..."
              if curl -fsSL -L --connect-timeout 15 --retry 2 "$URL" -o "/tmp/gh-setup/${GH_FILE}"; then
                tar -xzf "/tmp/gh-setup/${GH_FILE}" -C /tmp/gh-setup
                cp "/tmp/gh-setup/gh_${GH_VER}_linux_${GH_ARCH}/bin/gh" /usr/local/bin/gh 2>/dev/null || \
                cp "/tmp/gh-setup/gh_${GH_VER}_linux_${GH_ARCH}/bin/gh" /usr/bin/gh 2>/dev/null
                chmod +x /usr/local/bin/gh 2>/dev/null || chmod +x /usr/bin/gh 2>/dev/null
                rm -rf /tmp/gh-setup
                INSTALLED=true
                echo "✅ gh CLI 静态二进制已成功安装至 PATH"
                break
              fi
            done
          fi
          echo "gh version: $(gh --version 2>/dev/null || echo '未检测到版本')"

      # 宿主 Node 固定为 20.18.0：
      # 1) 打包目标为 Electron 32（Node 20 ABI），宿主 Node 20.18.0 与之 ABI 一致；
      # 2) bookworm 自带 GCC 12，better-sqlite3/sharp 等原生模块可直接编译，
      #    预编译二进制（GLIBC_2.29 要求）也可直接命中，无需源码编译回退。
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'

      - name: Clean packageManager from package.json
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('./package.json', 'utf8'));
            delete pkg.packageManager;
            fs.writeFileSync('./package.json', JSON.stringify(pkg, null, 2));
          "

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false

      # bookworm 自带 python3 (3.11)，原生模块构建直接使用系统 Python，
      # 无需 buster 时代的 python-build-standalone 手动安装
      - name: Verify Python
        shell: bash
        run: |
          python3 --version
          which python3

      - name: Override Electron version for Linux compatibility
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const path = './package.json';
            const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
            pkg.devDependencies.electron = '32.2.0';
            fs.writeFileSync(path, JSON.stringify(pkg, null, 2));
          "

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
        env:
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/

      - name: Rebuild native dependencies
        run: |
          pnpm exec electron-rebuild -f -v 32.2.0 -w better-sqlite3
          pnpm exec electron-rebuild -f -v 32.2.0 -w sharp

      - name: Install Sharp cross-platform dependencies
        run: pnpm run install-sharp-cross-platform

      - name: Create Production Env
        shell: bash
        env:
          ENV_BASE_B64: ${{ secrets.ENV_BASE }}
          ENV_PROD_B64: ${{ secrets.ENV_PROD }}
        run: |
          echo "📝 Injecting environment variables from Base64..."
          echo "$ENV_BASE_B64" | base64 --decode > .env
          echo "$ENV_PROD_B64" | base64 --decode > .env.production
          echo "📄 Showing filtered .env contents:"
          grep -E "VITE_POSTHOG_HOST|SUPABASE_URL" .env || true

      - name: Cache/Restore preset resources (llama.cpp)
        id: cache-presets
        uses: actions/cache@v4
        with:
          path: build/presetResources
          key: llama-presets-linux-v3-${{ hashFiles('build/extraResources/configs/preset-resources.lock.json', 'pro/extraResources/configs/preset-resources.lock.json') }}
          restore-keys: |
            llama-presets-linux-v3-

      - name: Sync Llama.cpp (Bypassed if cache hit and download_latest_llama is false)
        shell: bash
        env:
          DOWNLOAD_LATEST_LLAMA: ${{ github.event.inputs.download_latest_llama || 'true' }}
          FORCE_UPDATE: ${{ github.event.inputs.download_latest_llama || 'true' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ steps.cache-presets.outputs.cache-hit }}" != "true" || "$DOWNLOAD_LATEST_LLAMA" == "true" || "${{ github.event_name }}" == "push" ]]; then
            echo "📥 Syncing llama.cpp engine..."
            AI_ENGINE=llama.cpp pnpm run download:llama
          fi
          echo "🔍 [CI 诊断 - Linux] build/presetResources 内容:"
          ls -la build/presetResources || true
          ls -la build/presetResources/llama.cpp || true
          echo "🔍 [CI 诊断 - Linux] build/extraResources/configs/preset-resources.lock.json:"
          cat build/extraResources/configs/preset-resources.lock.json || true

      - name: Fetch published chinese-clip package (consume only, fail-closed)
        shell: bash
        run: |
          # chinese-clip 属 L 轨（文本塔 + gemma 四件套无下载链路，只有本地烘得出来）。
          # CI 不得重建：本步按 build/extraResources/configs/resources.bom.json 声明的
          # name/sha256/size 取**已发布**包并逐字校验，缺失或摘要不符即失败退出。
          # 严禁给本步加 `|| true` —— 那会把「取到旧代资产」伪装成「构建成功」。
          echo "📦 拉取已发布的 chinese-clip 明文包（不允许本地重建）..."
          node pro/scripts/run.js fetch-clip-resources.js
        env:
          GH_TOKEN: ${{ secrets.UNISOURCE_RELEASE_TOKEN || secrets.PRO_SUBMODULE_TOKEN || secrets.PRIVATE_MONOREPO_PAT || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Prepare public multimodal resources (monorepo-only, best-effort)
        shell: bash
        run: |
          echo "📦 检查并准备公开多模态预置资源..."
          # 公开模型（mobile-clip / nsfw-tiny / sensevoice-small / audio-cpp）可公开下载，
          # 但产包脚本只存在于 monorepo 根 scripts/，desktop 仓库 checkout 内没有它。
          # 因此这里显式判存在再执行，不做 `|| true` 静默掩蔽。
          if [[ -f scripts/download-multimodal-resources.js ]]; then
            node scripts/download-multimodal-resources.js --resource mobile-clip,nsfw-tiny,sensevoice-small,audio-cpp
          else
            echo "ℹ️ 本 checkout 不含 monorepo 的 scripts/：公开模型资源由 actions/cache 提供。"
            echo "   冷缓存场景请在 monorepo 执行 pnpm download:multimodal 后发布，再重跑发布流水线。"
          fi
        env:
          GH_TOKEN: ${{ secrets.UNISOURCE_RELEASE_TOKEN || secrets.PRO_SUBMODULE_TOKEN || secrets.PRIVATE_MONOREPO_PAT || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Resources (Basic)
        shell: bash
        run: |
          echo "🔍 [CI 诊断 - Linux] 执行 setup-resources 前的 build/presetResources/llama.cpp:"
          ls -la build/presetResources/llama.cpp || true
          pnpm run setup-resources
          echo "🔍 [CI 诊断 - Linux] 执行 setup-resources 后的 build/extraResources/bin:"
          ls -la build/extraResources/bin || true
        env:
          AI_ENGINE: llama.cpp
          FORCE_UPDATE_LLAMACPP: ${{ github.event.inputs.download_latest_llama || 'true' }}
          GH_TOKEN: ${{ secrets.UNISOURCE_RELEASE_TOKEN || secrets.PRO_SUBMODULE_TOKEN || secrets.PRIVATE_MONOREPO_PAT || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Verify extraResources (不多不少门禁)
        shell: bash
        run: |
          echo "🔍 校验最终打包目录 build/extraResources 是否不多不少..."
          node pro/scripts/run.js verify-extra-resources.js --prune

      - name: Copy App Icons
        shell: bash
        run: |
          mkdir -p build assets
          ASSETS_SRC="build/extraResources/assets"
          [ ! -d "$ASSETS_SRC" ] && ASSETS_SRC="assets"
          [ -f "$ASSETS_SRC/icon.ico" ] && cp "$ASSETS_SRC/icon.ico" build/icon.ico && cp "$ASSETS_SRC/icon.ico" assets/icon.ico || true
          [ -f "$ASSETS_SRC/icon.icns" ] && cp "$ASSETS_SRC/icon.icns" build/icon.icns && cp "$ASSETS_SRC/icon.icns" assets/icon.icns || true
          [ -f "$ASSETS_SRC/icon.png" ] && cp "$ASSETS_SRC/icon.png" build/icon.png && cp "$ASSETS_SRC/icon.png" assets/icon.png || true
          if [ "${{ github.event.inputs.build_region }}" = "INTL" ]; then
            cp "$ASSETS_SRC/boot_en.jpg" build/boot.jpg 2>/dev/null || cp "$ASSETS_SRC/boot.jpg" build/boot.jpg 2>/dev/null || true
          else
            cp "$ASSETS_SRC/boot.jpg" build/boot.jpg 2>/dev/null || true
          fi
          [ -f build/boot.jpg ] && cp build/boot.jpg build/boot.gif || true

      - name: Build Linux Application (${{ matrix.maker }})
        run: |
          if [ "${{ github.event.inputs.build_region }}" = "INTL" ]; then
            pnpm run make:intl
          else
            pnpm run make
          fi
        env:
          AI_ENGINE: llama.cpp
          BUILD_REGION: ${{ github.event.inputs.build_region || 'CN' }}
          LINUX_MAKER: ${{ matrix.maker }}

      - name: Verify Linux Release Artifacts (Smoke Test)
        shell: bash
        run: |
          echo "🔍 正在安装 Xvfb 及 Linux 运行环境..."
          apt-get update -y && apt-get install -y --no-install-recommends xvfb procps xauth || true

          echo "🔍 正在检索 out/make 目录下的 Linux 构建产物 (${{ matrix.maker }})..."
          TARGET_PKG=$(find out/make -name "*.${{ matrix.maker }}" 2>/dev/null | head -n 1)

          if [ -n "$TARGET_PKG" ] && [ -f "$TARGET_PKG" ]; then
            echo "📦 发现 Linux 安装包: $TARGET_PKG，正在测试安装..."
            if [ "${{ matrix.maker }}" = "deb" ]; then
              dpkg -i "$TARGET_PKG" || apt-get install -f -y
            elif [ "${{ matrix.maker }}" = "rpm" ]; then
              rpm -ivh --nodeps "$TARGET_PKG" || true
            fi
          else
            echo "⚠️ 未在 out/make 找到对应的 ${{ matrix.maker }} 安装包，尝试直接校验解包二进制..."
          fi

          # 定位 Electron 主程序：which 命中安装的启动器（CN/INTL 两种命名都要覆盖，
          # INTL 未命中正是导致 find 兜底误选 omni 的根因）；find 兜底时必须排除
          # firefly-omni 引擎二进制（它是 spawn 的子进程，崩溃会自动降级不阻断应用）
          APP_EXEC=$(which firefly-ai-folder 2>/dev/null || which firefly-ai-folder-cn 2>/dev/null || which firefly-ai-folder-intl 2>/dev/null || find /opt out /usr/bin -name 'firefly*' -type f -perm /111 2>/dev/null | grep -v "chrome-sandbox" | grep -v "bin/omni/" | head -n 1)
          if [ -z "$APP_EXEC" ] || [ ! -x "$APP_EXEC" ]; then
            echo "❌ 未能定位到已安装或生成的 Linux 二进制程序！"
            exit 1
          fi

          echo "🎯 目标测试程序路径: $APP_EXEC"
          echo "=== 启动应用进行 15s 烟雾健康监测 (Xvfb) ==="
          xvfb-run -a "$APP_EXEC" --no-sandbox --disable-gpu --disable-dev-shm-usage > /tmp/linux-smoke.log 2>&1 &
          APP_PID=$!
          echo "Linux Application PID: $APP_PID"

          for i in $(seq 1 8); do
            sleep 2
            if ! kill -0 $APP_PID 2>/dev/null; then
              echo "❌ Linux 应用程序异常崩溃！"
              cat /tmp/linux-smoke.log || true
              exit 1
            fi
            echo "  -> Linux 运行健康检测 at $(($i * 2))s: 进程存活 (glibc & 原生依赖正常)"
          done

          echo "✅ Linux 应用程序通过 15s 烟雾启动稳定性测试！"
          kill -15 $APP_PID 2>/dev/null || kill -9 $APP_PID 2>/dev/null || true
          echo "🎉 Linux 构建产物校验成功，准备执行后续发布！"

          # omni 引擎可用性验证：容器基线为 bookworm (glibc 2.36)，omni (要求 glibc 2.34+)
          # 必须完整可运行，直接执行二进制探活（--help 即可验证动态链接与启动）
          OMNI_BIN=$(find out -path "*resources/bin/omni/firefly-omni" -type f 2>/dev/null | head -n 1)
          if [ -n "$OMNI_BIN" ] && [ -f "$OMNI_BIN" ]; then
            chmod +x "$OMNI_BIN"
            echo "🧪 验证 omni 引擎可运行性: $OMNI_BIN"
            if "$OMNI_BIN" --help > /tmp/omni-check.log 2>&1; then
              echo "✅ firefly-omni 引擎运行正常（glibc/原生依赖满足）"
            else
              echo "❌ firefly-omni 引擎无法运行（动态链接失败或启动异常）:"
              cat /tmp/omni-check.log || true
              exit 1
            fi
          else
            echo "⚠️ 未找到 omni 引擎二进制，跳过 omni 可用性验证"
          fi

      - name: Generate Channel Update Manifest (Linux)
        shell: bash
        env:
          BUILD_REGION: ${{ github.event.inputs.build_region || 'CN' }}
        run: |
          echo "📝 生成自动更新渠道清单..."
          node pro/scripts/run.js generate-channel-manifest.js --assert-isolation

      - name: Publish Candidate to Cloudflare R2 (Fail-Fast)
        if: needs.plan.outputs.release_channel == 'candidate'
        shell: bash
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_DOMAIN: ${{ secrets.R2_PUBLIC_DOMAIN }}
          RELEASE_VERSION: ${{ needs.plan.outputs.pkg_version }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          echo "📤 Uploading Linux candidate artifacts to R2 candidates/..."
          pnpm run publish:r2

      - name: Upload Dev Artifacts (Skip R2)
        if: needs.plan.outputs.release_channel == 'dev'
        uses: actions/upload-artifact@v4
        with:
          name: dev-linux-${{ matrix.maker }}
          retention-days: 7
          path: |
            out/make/**/*.deb
            out/make/**/*.rpm
            out/make/**/*.AppImage
            out/make/**/*.blockmap
            out/make/**/*.yml

  # ==============================================================================
  # Stage C: 统一收口原子提交 (finalize) — 仅全平台绿灯时单点操作 GitHub Release
  # ==============================================================================
  finalize:
    name: 原子收口发布 (Stage C)
    needs: [plan, build-macos, build-windows, build-linux]
    if: |
      always() &&
      needs.plan.result == 'success' &&
      (
        (needs.plan.outputs.release_channel == 'candidate' &&
         needs.build-macos.result == 'success' &&
         needs.build-windows.result == 'success' &&
         needs.build-linux.result == 'success') ||
        (needs.plan.outputs.release_channel == 'dev' &&
         (needs.build-macos.result == 'success' || needs.build-macos.result == 'skipped') &&
         (needs.build-windows.result == 'success' || needs.build-windows.result == 'skipped') &&
         (needs.build-linux.result == 'success' || needs.build-linux.result == 'skipped') &&
         !(needs.build-macos.result == 'failure' || needs.build-windows.result == 'failure' || needs.build-linux.result == 'failure') &&
         !(needs.build-macos.result == 'cancelled' || needs.build-windows.result == 'cancelled' || needs.build-linux.result == 'cancelled'))
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Open-Source Desktop Code (Pinned to target_sha)
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.target_sha }}

      - name: 解析并检出 pro 子模块（git ls-tree 四重断言）
        id: resolve_pro
        shell: bash
        run: |
          ENTRY=$(git ls-tree HEAD pro)
          [ -n "$ENTRY" ] || { echo "::error::未找到 pro gitlink"; exit 1; }
          MODE=$(echo "$ENTRY" | awk '{print $1}')
          TYPE=$(echo "$ENTRY" | awk '{print $2}')
          PRO_SHA=$(echo "$ENTRY" | awk '{print $3}')
          [ "$MODE" = "160000" ] && [ "$TYPE" = "commit" ] && [[ "$PRO_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::pro gitlink 四重断言失败: $ENTRY"; exit 1;
          }
          echo "pro_sha=$PRO_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout Private Pro Module
        uses: actions/checkout@v4
        with:
          repository: Leonard-Li777/firefly-ai-folder-desktop-pro
          token: ${{ secrets.PRO_SUBMODULE_TOKEN }}
          path: pro
          ref: ${{ steps.resolve_pro.outputs.pro_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'

      - name: Download Dev Artifacts (仅 dev 通道)
        if: needs.plan.outputs.release_channel == 'dev'
        uses: actions/download-artifact@v4
        with:
          pattern: dev-*
          path: dist-dev-artifacts
          merge-multiple: true

      - name: 执行 Stage C 原子收口 (finalize-release.js)
        shell: bash
        env:
          RELEASE_CHANNEL: ${{ needs.plan.outputs.release_channel }}
          PKG_VERSION: ${{ needs.plan.outputs.pkg_version }}
          TARGET_SHA: ${{ needs.plan.outputs.target_sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_PROMOTE_TOKEN: ${{ secrets.RELEASE_PROMOTE_TOKEN }}
          GH_TOKEN: ${{ secrets.RELEASE_PROMOTE_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          node pro/scripts/ci/finalize-release.js
