name: Verify Release Artifacts (Multi-Platform Smoke Test)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag to verify (leave empty for latest release)'
        required: false
        default: ''
        type: string
      region:
        description: 'Target region edition to test (cn / intl)'
        required: false
        default: 'cn'
        type: choice
        options:
          - cn
          - intl

permissions:
  contents: read

jobs:
  resolve-release:
    name: Resolve Target Release Assets
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.get_release.outputs.tag_name }}
      win_exe_url: ${{ steps.get_release.outputs.win_exe_url }}
      win_exe_name: ${{ steps.get_release.outputs.win_exe_name }}
      mac_dmg_arm64_url: ${{ steps.get_release.outputs.mac_dmg_arm64_url }}
      mac_dmg_arm64_name: ${{ steps.get_release.outputs.mac_dmg_arm64_name }}
      mac_dmg_x64_url: ${{ steps.get_release.outputs.mac_dmg_x64_url }}
      mac_dmg_x64_name: ${{ steps.get_release.outputs.mac_dmg_x64_name }}
      mac_dmg_default_url: ${{ steps.get_release.outputs.mac_dmg_default_url }}
      mac_dmg_default_name: ${{ steps.get_release.outputs.mac_dmg_default_name }}
      linux_deb_amd64_url: ${{ steps.get_release.outputs.linux_deb_amd64_url }}
      linux_deb_arm64_url: ${{ steps.get_release.outputs.linux_deb_arm64_url }}
      linux_deb_default_url: ${{ steps.get_release.outputs.linux_deb_default_url }}
      linux_deb_default_name: ${{ steps.get_release.outputs.linux_deb_default_name }}
      linux_rpm_amd64_url: ${{ steps.get_release.outputs.linux_rpm_amd64_url }}
      linux_rpm_arm64_url: ${{ steps.get_release.outputs.linux_rpm_arm64_url }}
      linux_rpm_default_url: ${{ steps.get_release.outputs.linux_rpm_default_url }}
      linux_rpm_default_name: ${{ steps.get_release.outputs.linux_rpm_default_name }}
      app_name: ${{ steps.get_release.outputs.app_name }}
    steps:
      - name: Fetch Release Information
        id: get_release
        uses: actions/github-script@v7
        with:
          script: |
            const targetTag = context.payload.inputs?.tag_name || '';
            const region = (context.payload.inputs?.region || 'cn').toLowerCase();
            const appName = `firefly-ai-folder-${region}`;
            
            let release;
            if (targetTag) {
              core.info(`Fetching release by tag: ${targetTag}`);
              const res = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: targetTag
              });
              release = res.data;
            } else {
              core.info('Fetching latest release...');
              const res = await github.rest.repos.getLatestRelease({
                owner: context.repo.owner,
                repo: context.repo.repo
              });
              release = res.data;
            }

            core.info(`Target Release: ${release.tag_name} (${release.name})`);
            core.setOutput('tag_name', release.tag_name);
            core.setOutput('app_name', appName);

            const assets = release.assets || [];
            core.info(`Found ${assets.length} assets in release:`);
            assets.forEach(a => core.info(` - ${a.name} (${a.size} bytes)`));

            // Windows .exe
            const winExe = assets.find(a => a.name.endsWith('.exe') && (a.name.includes(region) || !a.name.includes('intl')));
            if (winExe) {
              core.setOutput('win_exe_url', winExe.browser_download_url);
              core.setOutput('win_exe_name', winExe.name);
            }

            // macOS .dmg (arch-specific & generic matching for separate arm64 / x64 architectures)
            const macDmgAssets = assets.filter(a => a.name.endsWith('.dmg') && (a.name.includes(region) || !a.name.includes('intl')));
            const macDmgArm64 = macDmgAssets.find(a => /arm64|aarch64/i.test(a.name));
            const macDmgX64 = macDmgAssets.find(a => /x64|x86_64|intel/i.test(a.name));
            const macDmgDefault = macDmgAssets[0];

            if (macDmgArm64) {
              core.setOutput('mac_dmg_arm64_url', macDmgArm64.browser_download_url);
              core.setOutput('mac_dmg_arm64_name', macDmgArm64.name);
            }
            if (macDmgX64) {
              core.setOutput('mac_dmg_x64_url', macDmgX64.browser_download_url);
              core.setOutput('mac_dmg_x64_name', macDmgX64.name);
            }
            if (macDmgDefault) {
              core.setOutput('mac_dmg_default_url', macDmgDefault.browser_download_url);
              core.setOutput('mac_dmg_default_name', macDmgDefault.name);
            }

            // Linux .deb (arch-specific & generic matching)
            const debAssets = assets.filter(a => a.name.endsWith('.deb') && (a.name.includes(region) || !a.name.includes('intl')));
            const debAmd64 = debAssets.find(a => /amd64|x86_64|x64/i.test(a.name));
            const debArm64 = debAssets.find(a => /arm64|aarch64/i.test(a.name));
            const debDefault = debAssets[0];

            if (debAmd64) core.setOutput('linux_deb_amd64_url', debAmd64.browser_download_url);
            if (debArm64) core.setOutput('linux_deb_arm64_url', debArm64.browser_download_url);
            if (debDefault) {
              core.setOutput('linux_deb_default_url', debDefault.browser_download_url);
              core.setOutput('linux_deb_default_name', debDefault.name);
            }

            // Linux .rpm (arch-specific & generic matching)
            const rpmAssets = assets.filter(a => a.name.endsWith('.rpm') && (a.name.includes(region) || !a.name.includes('intl')));
            const rpmAmd64 = rpmAssets.find(a => /x86_64|amd64|x64/i.test(a.name));
            const rpmArm64 = rpmAssets.find(a => /aarch64|arm64/i.test(a.name));
            const rpmDefault = rpmAssets[0];

            if (rpmAmd64) core.setOutput('linux_rpm_amd64_url', rpmAmd64.browser_download_url);
            if (rpmArm64) core.setOutput('linux_rpm_arm64_url', rpmArm64.browser_download_url);
            if (rpmDefault) {
              core.setOutput('linux_rpm_default_url', rpmDefault.browser_download_url);
              core.setOutput('linux_rpm_default_name', rpmDefault.name);
            }

  # ==============================================================================
  # 1. Windows x64 Verification
  # ==============================================================================
  test-windows:
    name: Test Windows (x64)
    needs: resolve-release
    if: needs.resolve-release.outputs.win_exe_url != ''
    runs-on: windows-latest
    steps:
      - name: Download Windows Installer
        shell: pwsh
        run: |
          $url = "${{ needs.resolve-release.outputs.win_exe_url }}"
          $fileName = "${{ needs.resolve-release.outputs.win_exe_name }}"
          Write-Host "Downloading: $url -> $fileName"
          Invoke-WebRequest -Uri $url -OutFile $fileName -UseBasicParsing

      - name: Silent Install and Directory Resolution
        shell: pwsh
        run: |
          $installer = "${{ needs.resolve-release.outputs.win_exe_name }}"
          $installDir = "C:\TestApp"
          Write-Host "Executing silent installation to $installDir..."
          $process = Start-Process -FilePath ".\$installer" -ArgumentList "/S", "/D=$installDir" -PassThru -Wait
          Write-Host "Installer exit code: $($process.ExitCode)"
          
          # Allow background NSIS unpack to complete
          Start-Sleep -Seconds 5

          # Locate the main executable
          $exeCandidate = Get-ChildItem -Path $installDir -Filter "*.exe" -Recurse | Where-Object { $_.Name -notmatch "Uninstall" -and $_.Name -match "firefly" } | Select-Object -First 1
          if (-not $exeCandidate) {
            # Fallback check standard AppData installation directory
            $fallbackDir = Join-Path $env:LOCALAPPDATA "Programs\${{ needs.resolve-release.outputs.app_name }}"
            if (Test-Path $fallbackDir) {
              $exeCandidate = Get-ChildItem -Path $fallbackDir -Filter "*.exe" | Where-Object { $_.Name -notmatch "Uninstall" } | Select-Object -First 1
            }
          }

          if (-not $exeCandidate) {
            Get-ChildItem -Path $installDir -Recurse | Select-Object FullName
            throw "Failed to locate installed application executable!"
          }

          Write-Host "Found executable: $($exeCandidate.FullName)"
          "APP_EXE_PATH=$($exeCandidate.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Launch App & 15s Smoke Test
        shell: pwsh
        run: |
          $exePath = $env:APP_EXE_PATH
          Write-Host "Launching application: $exePath"
          $proc = Start-Process -FilePath $exePath -ArgumentList "--no-sandbox", "--disable-gpu" -PassThru
          
          Write-Host "Application PID: $($proc.Id). Monitoring process health for 15 seconds..."
          $elapsed = 0
          while ($elapsed -lt 15) {
            Start-Sleep -Seconds 2
            $elapsed += 2
            $proc.Refresh()
            if ($proc.HasExited) {
              throw "Application crashed unexpectedly during startup! Exit code: $($proc.ExitCode)"
            }
            Write-Host "  -> Health check at ${elapsed}s: Process alive (Memory: $([math]::Round($proc.WorkingSet64/1MB, 2)) MB)"
          }

          Write-Host "Application passed 15-second startup stability smoke test!"
          Write-Host "Gracefully stopping process..."
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue

  # ==============================================================================
  # 2. macOS Verification (Independent Apple Silicon arm64 & Intel x64 Packages)
  # ==============================================================================
  test-macos:
    name: Test macOS (${{ matrix.name }})
    needs: resolve-release
    if: needs.resolve-release.outputs.mac_dmg_default_url != '' || needs.resolve-release.outputs.mac_dmg_arm64_url != '' || needs.resolve-release.outputs.mac_dmg_x64_url != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: "arm64"
            name: "Apple Silicon (arm64)"
            os: "macos-latest"
            arch_flag: "-arm64"
          - arch: "x64"
            name: "Intel (x64 / Rosetta 2)"
            os: "macos-latest"
            arch_flag: "-x86_64"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Download macOS DMG (${{ matrix.name }})
        run: |
          # 优先使用与架构严格匹配的独立包，若无则回退至默认包
          URL=""
          FILE_NAME=""
          if [ "${{ matrix.arch }}" = "arm64" ] && [ -n "${{ needs.resolve-release.outputs.mac_dmg_arm64_url }}" ]; then
            URL="${{ needs.resolve-release.outputs.mac_dmg_arm64_url }}"
            FILE_NAME="${{ needs.resolve-release.outputs.mac_dmg_arm64_name }}"
          elif [ "${{ matrix.arch }}" = "x64" ] && [ -n "${{ needs.resolve-release.outputs.mac_dmg_x64_url }}" ]; then
            URL="${{ needs.resolve-release.outputs.mac_dmg_x64_url }}"
            FILE_NAME="${{ needs.resolve-release.outputs.mac_dmg_x64_name }}"
          else
            URL="${{ needs.resolve-release.outputs.mac_dmg_default_url }}"
            FILE_NAME="${{ needs.resolve-release.outputs.mac_dmg_default_name }}"
          fi

          if [ -z "$URL" ]; then
            echo "⚠️ 未找到适用于 ${{ matrix.arch }} 架构的 macOS DMG 资产，跳过。"
            exit 0
          fi

          echo "Downloading $URL -> $FILE_NAME"
          curl -L -o "$FILE_NAME" "$URL"
          echo "DOWNLOADED_DMG=$FILE_NAME" >> $GITHUB_ENV

      - name: Mount DMG & Extract Application
        run: |
          FILE_NAME="$DOWNLOADED_DMG"
          if [ -z "$FILE_NAME" ] || [ ! -f "$FILE_NAME" ]; then
            echo "⚠️ 未下载到有效安装包，跳过后续步骤。"
            exit 0
          fi

          MOUNT_DIR="/Volumes/FireflyInstaller_${{ matrix.arch }}"
          echo "Mounting $FILE_NAME to $MOUNT_DIR..."
          hdiutil attach "$FILE_NAME" -mountpoint "$MOUNT_DIR" -nobrowse
          
          APP_NAME=$(ls -d "$MOUNT_DIR"/*.app | head -n 1)
          if [ -z "$APP_NAME" ]; then
            echo "Error: No .app bundle found inside DMG!"
            hdiutil detach "$MOUNT_DIR" || true
            exit 1
          fi
          
          echo "Found app bundle: $APP_NAME"
          mkdir -p /tmp/FireflyTest_${{ matrix.arch }}
          cp -R "$APP_NAME" /tmp/FireflyTest_${{ matrix.arch }}/
          hdiutil detach "$MOUNT_DIR"
          
          LOCAL_APP="/tmp/FireflyTest_${{ matrix.arch }}/$(basename "$APP_NAME")"
          echo "Removing quarantine attributes..."
          xattr -dr com.apple.quarantine "$LOCAL_APP" || true
          
          # Find binary
          BIN_PATH=$(find "$LOCAL_APP/Contents/MacOS" -type f -perm +111 | head -n 1)
          echo "APP_BIN_PATH=$BIN_PATH" >> $GITHUB_ENV
          echo "Binary path: $BIN_PATH"

          echo "=== [1/2] 二进制架构信息检查 ==="
          lipo -info "$BIN_PATH" || file "$BIN_PATH"

      - name: Launch App via arch ${{ matrix.arch_flag }} & 15s Smoke Test
        run: |
          if [ -z "$APP_BIN_PATH" ] || [ ! -f "$APP_BIN_PATH" ]; then
            echo "⚠️ 二进制未找到，跳过启动测试。"
            exit 0
          fi

          echo "Starting application with target architecture: ${{ matrix.name }}"
          echo "Command: arch ${{ matrix.arch_flag }} \"$APP_BIN_PATH\" --no-sandbox --disable-gpu"
          
          arch ${{ matrix.arch_flag }} "$APP_BIN_PATH" --no-sandbox --disable-gpu > /tmp/app-stdout.log 2>&1 &
          APP_PID=$!
          echo "Application started with PID: $APP_PID"

          # Verify the running process architecture
          sleep 1
          echo "=== 进程实时运行架构检查 ==="
          pgrep -f "$(basename "$APP_BIN_PATH")" | xargs -I {} ps -p {} -o pid,arch,command || true

          for i in {1..8}; do
            sleep 2
            if ! kill -0 $APP_PID 2>/dev/null; then
              echo "❌ Application crashed prematurely under ${{ matrix.name }}!"
              echo "=== Application Output Logs ==="
              cat /tmp/app-stdout.log || true
              exit 1
            fi
            echo "  -> Health check at $((i*2))s: Process $APP_PID is alive."
          done

          echo "✅ macOS ${{ matrix.name }} passed 15-second startup stability smoke test!"
          kill -15 $APP_PID 2>/dev/null || kill -9 $APP_PID 2>/dev/null || true

  # ==============================================================================
  # 3. Linux DEB Verification (Multi-Distro Matrix: Ubuntu, Debian, Deepin Baseline)
  # ==============================================================================
  test-linux-deb:
    name: Test DEB (${{ matrix.name }})
    needs: resolve-release
    if: needs.resolve-release.outputs.linux_deb_default_url != '' || needs.resolve-release.outputs.linux_deb_amd64_url != '' || needs.resolve-release.outputs.linux_deb_arm64_url != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: "ubuntu-20-04-x64"
            name: "Ubuntu 20.04 (glibc 2.31, x64)"
            image: "ubuntu:20.04"
            arch: "amd64"
          - id: "ubuntu-22-04-x64"
            name: "Ubuntu 22.04 (glibc 2.35, x64)"
            image: "ubuntu:22.04"
            arch: "amd64"
          - id: "ubuntu-24-04-x64"
            name: "Ubuntu 24.04 (glibc 2.39, x64)"
            image: "ubuntu:24.04"
            arch: "amd64"
          - id: "debian-10-x64"
            name: "Debian 10 Buster (glibc 2.28 / Deepin 20.x, x64)"
            image: "debian:10-slim"
            arch: "amd64"
          - id: "debian-11-x64"
            name: "Debian 11 Bullseye (glibc 2.31, x64)"
            image: "debian:11-slim"
            arch: "amd64"
          - id: "debian-12-x64"
            name: "Debian 12 Bookworm (glibc 2.36 / Deepin 23, x64)"
            image: "debian:12-slim"
            arch: "amd64"
          - id: "ubuntu-22-04-arm64"
            name: "Ubuntu 22.04 (glibc 2.35, arm64)"
            image: "ubuntu:22.04"
            arch: "arm64"
          - id: "debian-12-arm64"
            name: "Debian 12 Bookworm (glibc 2.36 / Deepin 23, arm64)"
            image: "debian:12-slim"
            arch: "arm64"
    runs-on: ubuntu-latest
    steps:
      - name: Set up QEMU for Multi-Arch Container Execution
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v3

      - name: Download DEB Package Matching Target Architecture
        id: download_deb
        run: |
          TARGET_ARCH="${{ matrix.arch }}"
          URL=""

          if [ "$TARGET_ARCH" = "amd64" ]; then
            URL="${{ needs.resolve-release.outputs.linux_deb_amd64_url }}"
          elif [ "$TARGET_ARCH" = "arm64" ]; then
            URL="${{ needs.resolve-release.outputs.linux_deb_arm64_url }}"
          fi

          # Fallback to default generic DEB asset if arch-specific asset is not defined
          if [ -z "$URL" ]; then
            URL="${{ needs.resolve-release.outputs.linux_deb_default_url }}"
          fi

          if [ -z "$URL" ]; then
            echo "❌ No DEB URL found for architecture $TARGET_ARCH"
            exit 1
          fi

          echo "Downloading $URL -> app.deb"
          curl -L -o app.deb "$URL"

      - name: Run DEB Install & 15s Startup Smoke Test in Docker Container
        run: |
          DOCKER_PLATFORM="linux/amd64"
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            DOCKER_PLATFORM="linux/arm64"
          fi

          echo "Running on Docker Platform: $DOCKER_PLATFORM with Image: ${{ matrix.image }}"
          
          docker run --rm --platform $DOCKER_PLATFORM \
            -v "$(pwd)/app.deb:/tmp/app.deb" \
            "${{ matrix.image }}" /bin/bash -c "
              set -e
              export DEBIAN_FRONTEND=noninteractive

              # Fix Debian 10 archive repositories if needed
              if grep -q '10' /etc/debian_version 2>/dev/null; then
                sed -i 's/deb.debian.org/archive.debian.org/g' /etc/apt/sources.list || true
                sed -i 's|security.debian.org/debian-security|archive.debian.org/debian-security|g' /etc/apt/sources.list || true
                sed -i '/stretch-updates/d' /etc/apt/sources.list || true
              fi

              echo '=== [1/4] Updating Package Repositories ==='
              apt-get update -y
              
              echo '=== [2/4] Installing Xvfb and GUI Runtime Dependencies ==='
              apt-get install -y --no-install-recommends \
                xvfb \
                ca-certificates \
                dpkg \
                libgtk-3-0 \
                libnss3 \
                libasound2 \
                libgbm1 \
                libsecret-1-0 \
                libnotify4 \
                libxss1 \
                libxtst6 \
                xauth \
                procps \
                dbus || true

              echo '=== [3/4] Validating Package Architecture & Installing ==='
              PKG_ARCH=\$(dpkg-deb -f /tmp/app.deb Architecture 2>/dev/null || echo 'unknown')
              SYS_ARCH=\$(dpkg --print-architecture)
              echo \"Package Arch: \$PKG_ARCH | System Arch: \$SYS_ARCH\"

              # Guard: If package architecture doesn't match container architecture, skip gracefully
              if [ \"\$PKG_ARCH\" != \"\$SYS_ARCH\" ] && [ \"\$PKG_ARCH\" != \"all\" ] && [ \"\$PKG_ARCH\" != \"unknown\" ]; then
                echo \"⚠️ [SKIPPED] Package architecture (\$PKG_ARCH) does not match system (\$SYS_ARCH). Skipping test on this container.\"
                exit 0
              fi

              dpkg -i /tmp/app.deb || apt-get install -f -y

              APP_EXEC=\$(which ${{ needs.resolve-release.outputs.app_name }} 2>/dev/null || find /opt /usr/bin -name 'firefly*' -type f -perm /111 2>/dev/null | head -n 1)
              if [ -z \"\$APP_EXEC\" ] || [ ! -x \"\$APP_EXEC\" ]; then
                echo \"❌ Error: Executable was not found or is not executable after installation!\"
                exit 1
              fi
              echo \"Found executable: \$APP_EXEC\"

              echo '=== [4/4] Starting Application with Xvfb (15s Smoke Test) ==='
              xvfb-run -a \"\$APP_EXEC\" --no-sandbox --disable-gpu --disable-dev-shm-usage > /tmp/app-run.log 2>&1 &
              APP_PID=\$!
              echo \"Application running with PID: \$APP_PID\"

              for i in \$(seq 1 8); do
                sleep 2
                if ! kill -0 \$APP_PID 2>/dev/null; then
                  echo '❌ Application crashed on ${{ matrix.name }}!'
                  echo '=== Crash Logs / Output ==='
                  cat /tmp/app-run.log || true
                  exit 1
                fi
                echo \"  -> Health check at \$((\$i * 2))s: Alive (glibc & native modules OK)\"
              done

              echo '✅ ${{ matrix.name }} 15s startup smoke test PASSED!'
              kill -15 \$APP_PID 2>/dev/null || kill -9 \$APP_PID 2>/dev/null || true
            "

  # ==============================================================================
  # 4. Linux RPM Verification (Fedora, Rocky Linux 9)
  # ==============================================================================
  test-linux-rpm:
    name: Test RPM (${{ matrix.name }})
    needs: resolve-release
    if: needs.resolve-release.outputs.linux_rpm_default_url != '' || needs.resolve-release.outputs.linux_rpm_amd64_url != '' || needs.resolve-release.outputs.linux_rpm_arm64_url != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: "fedora-39-x64"
            name: "Fedora 39 (x64)"
            image: "fedora:39"
            arch: "amd64"
          - id: "fedora-40-x64"
            name: "Fedora 40 (x64)"
            image: "fedora:40"
            arch: "amd64"
          - id: "rocky-9-x64"
            name: "Rocky Linux 9 (x64)"
            image: "rockylinux:9"
            arch: "amd64"
          - id: "fedora-40-arm64"
            name: "Fedora 40 (arm64)"
            image: "fedora:40"
            arch: "arm64"
    runs-on: ubuntu-latest
    steps:
      - name: Set up QEMU for Multi-Arch Container Execution
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v3

      - name: Download RPM Package Matching Target Architecture
        id: download_rpm
        run: |
          TARGET_ARCH="${{ matrix.arch }}"
          URL=""

          if [ "$TARGET_ARCH" = "amd64" ]; then
            URL="${{ needs.resolve-release.outputs.linux_rpm_amd64_url }}"
          elif [ "$TARGET_ARCH" = "arm64" ]; then
            URL="${{ needs.resolve-release.outputs.linux_rpm_arm64_url }}"
          fi

          if [ -z "$URL" ]; then
            URL="${{ needs.resolve-release.outputs.linux_rpm_default_url }}"
          fi

          if [ -z "$URL" ]; then
            echo "❌ No RPM URL found for architecture $TARGET_ARCH"
            exit 1
          fi

          echo "Downloading $URL -> app.rpm"
          curl -L -o app.rpm "$URL"

      - name: Run RPM Install & 15s Startup Smoke Test in Docker Container
        run: |
          DOCKER_PLATFORM="linux/amd64"
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            DOCKER_PLATFORM="linux/arm64"
          fi

          echo "Running on Docker Platform: $DOCKER_PLATFORM with Image: ${{ matrix.image }}"
          
          docker run --rm --platform $DOCKER_PLATFORM \
            -v "$(pwd)/app.rpm:/tmp/app.rpm" \
            "${{ matrix.image }}" /bin/bash -c "
              set -e
              echo '=== [1/4] Installing Dependencies and Xvfb ==='
              dnf install -y --setopt=install_weak_deps=False \
                xorg-x11-server-Xvfb \
                gtk3 \
                nss \
                alsa-lib \
                mesa-libgbm \
                libsecret \
                libnotify \
                procps-ng \
                rpm \
                ca-certificates || true

              echo '=== [2/4] Validating Package Architecture & Installing ==='
              PKG_ARCH=\$(rpm -qp --queryformat '%{ARCH}' /tmp/app.rpm 2>/dev/null || echo 'unknown')
              SYS_ARCH=\$(uname -m)
              echo \"Package Arch: \$PKG_ARCH | System Arch: \$SYS_ARCH\"

              # Guard: If package architecture doesn't match container architecture, skip gracefully
              if [ \"\$PKG_ARCH\" != \"noarch\" ] && [ \"\$PKG_ARCH\" != \"unknown\" ]; then
                if [ \"\$SYS_ARCH\" = \"x86_64\" ] && [ \"\$PKG_ARCH\" != \"x86_64\" ] && [ \"\$PKG_ARCH\" != \"amd64\" ]; then
                  echo \"⚠️ [SKIPPED] Package architecture (\$PKG_ARCH) does not match system (\$SYS_ARCH). Skipping test on this container.\"
                  exit 0
                fi
                if [ \"\$SYS_ARCH\" = \"aarch64\" ] && [ \"\$PKG_ARCH\" != \"aarch64\" ] && [ \"\$PKG_ARCH\" != \"arm64\" ]; then
                  echo \"⚠️ [SKIPPED] Package architecture (\$PKG_ARCH) does not match system (\$SYS_ARCH). Skipping test on this container.\"
                  exit 0
                fi
              fi

              dnf install -y /tmp/app.rpm || rpm -ivh --nodeps /tmp/app.rpm

              APP_EXEC=\$(which ${{ needs.resolve-release.outputs.app_name }} 2>/dev/null || find /opt /usr/bin -name 'firefly*' -type f -perm /111 2>/dev/null | head -n 1)
              if [ -z \"\$APP_EXEC\" ] || [ ! -x \"\$APP_EXEC\" ]; then
                echo \"❌ Error: Executable was not found or is not executable after installation!\"
                exit 1
              fi
              echo \"Found executable: \$APP_EXEC\"

              echo '=== [3/4] Starting Application with Xvfb (15s Smoke Test) ==='
              xvfb-run -a \"\$APP_EXEC\" --no-sandbox --disable-gpu --disable-dev-shm-usage > /tmp/rpm-run.log 2>&1 &
              APP_PID=\$!
              echo \"Application running with PID: \$APP_PID\"

              for i in \$(seq 1 8); do
                sleep 2
                if ! kill -0 \$APP_PID 2>/dev/null; then
                  echo '❌ Application crashed on ${{ matrix.name }}!'
                  echo '=== Crash Logs / Output ==='
                  cat /tmp/rpm-run.log || true
                  exit 1
                fi
                echo \"  -> Health check at \$((\$i * 2))s: Alive\"
              done

              echo '✅ ${{ matrix.name }} 15s startup smoke test PASSED!'
              kill -15 \$APP_PID 2>/dev/null || kill -9 \$APP_PID 2>/dev/null || true
            "

  # ==============================================================================
  # 5. Verification Summary
  # ==============================================================================
  verification-summary:
    name: Multi-Platform Smoke Test Summary
    needs: [resolve-release, test-windows, test-macos, test-linux-deb, test-linux-rpm]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Generate Summary Report
        run: |
          echo "## 🚀 Release Verification & Smoke Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Target Release:** \`${{ needs.resolve-release.outputs.tag_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Product Edition:** \`${{ needs.resolve-release.outputs.app_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test Platform / Matrix | Status | Details |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          
          # Windows
          if [ "${{ needs.test-windows.result }}" = "success" ]; then
            echo "| 🪟 Windows (x64) | ✅ Passed | NSIS Silent Install & 15s Process Alive |" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.test-windows.result }}" = "skipped" ]; then
            echo "| 🪟 Windows (x64) | ⚠️ Skipped | Asset not found |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 🪟 Windows (x64) | ❌ Failed | Startup or Crash Error |" >> $GITHUB_STEP_SUMMARY
          fi

          # macOS
          if [ "${{ needs.test-macos.result }}" = "success" ]; then
            echo "| 🍎 macOS (Apple Silicon arm64 & Intel x64) | ✅ Passed | DMG Mount, Gatekeeper bypass & 15s Process Alive |" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.test-macos.result }}" = "skipped" ]; then
            echo "| 🍎 macOS (Apple Silicon arm64 & Intel x64) | ⚠️ Skipped | Asset not found |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 🍎 macOS (Apple Silicon arm64 & Intel x64) | ❌ Failed | Startup or Crash Error |" >> $GITHUB_STEP_SUMMARY
          fi

          # Linux DEB
          if [ "${{ needs.test-linux-deb.result }}" = "success" ]; then
            echo "| 🐧 Linux DEB (Ubuntu/Debian/Deepin x64 & arm64) | ✅ Passed | DEB Install, glibc compatibility & Xvfb Smoke Test |" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.test-linux-deb.result }}" = "skipped" ]; then
            echo "| 🐧 Linux DEB | ⚠️ Skipped | Asset not found |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 🐧 Linux DEB | ❌ Failed | Installation or glibc/X11 error |" >> $GITHUB_STEP_SUMMARY
          fi

          # Linux RPM
          if [ "${{ needs.test-linux-rpm.result }}" = "success" ]; then
            echo "| 🐧 Linux RPM (Fedora/Rocky Linux x64 & arm64) | ✅ Passed | RPM Install & Xvfb Smoke Test |" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.test-linux-rpm.result }}" = "skipped" ]; then
            echo "| 🐧 Linux RPM | ⚠️ Skipped | Asset not found |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 🐧 Linux RPM | ❌ Failed | Installation or dependency error |" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🎉 All tests evaluated." >> $GITHUB_STEP_SUMMARY
