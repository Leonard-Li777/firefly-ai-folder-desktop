name: Build and Package Firefly Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: win32-x64
          - os: macos-latest
            target: darwin-x64
          - os: ubuntu-latest
            target: linux-x64

    steps:
      - name: Checkout Open-Source Desktop Code
        uses: actions/checkout@v4

      - name: Checkout Private Pro Module (If Secret Available)
        if: ${{ secrets.PRIVATE_MONOREPO_PAT != '' }}
        uses: actions/checkout@v4
        with:
          repository: Leonard-Li777/firefly-ai-folder-desktop-pro
          token: ${{ secrets.PRIVATE_MONOREPO_PAT }}
          path: pro

      - name: Setup Node.js & pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.3

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Package Desktop Executable
        run: pnpm package

      - name: Release Packages
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: out/make/**/*
