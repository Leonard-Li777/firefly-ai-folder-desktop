name: Release Package E2E Functional Test Pipeline

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Target Release Tag (leave empty for latest release)'
        required: false
        default: ''
        type: string
      region:
        description: 'Target region edition to test (cn / intl)'
        required: false
        default: 'cn'
        type: choice
        options:
          - cn
          - intl
      platform_scope:
        description: 'Platform scope to test'
        required: false
        default: 'windows-only'
        type: choice
        options:
          - windows-only
          - all-platforms
          - linux-only
          - macos-only

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # ==============================================================================
  # 0. Resolve Target Release Assets
  # ==============================================================================
  resolve-release:
    name: Resolve Target Release Assets
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.get_release.outputs.tag_name }}
      win_exe_url: ${{ steps.get_release.outputs.win_exe_url }}
      win_exe_name: ${{ steps.get_release.outputs.win_exe_name }}
      mac_dmg_url: ${{ steps.get_release.outputs.mac_dmg_url }}
      mac_dmg_name: ${{ steps.get_release.outputs.mac_dmg_name }}
      linux_deb_url: ${{ steps.get_release.outputs.linux_deb_url }}
      linux_deb_name: ${{ steps.get_release.outputs.linux_deb_name }}
      app_name: ${{ steps.get_release.outputs.app_name }}
    steps:
      - name: Fetch Release Information
        id: get_release
        uses: actions/github-script@v7
        with:
          script: |
            const targetTag = context.payload.inputs?.tag_name || '';
            const region = (context.payload.inputs?.region || 'cn').toLowerCase();
            const appName = `firefly-ai-folder-${region}`;

            let release;
            if (targetTag) {
              core.info(`Fetching release by tag: ${targetTag}`);
              const res = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: targetTag
              });
              release = res.data;
            } else {
              core.info('Fetching latest release...');
              const res = await github.rest.repos.getLatestRelease({
                owner: context.repo.owner,
                repo: context.repo.repo
              });
              release = res.data;
            }

            core.info(`Target Release: ${release.tag_name} (${release.name})`);
            core.setOutput('tag_name', release.tag_name);
            core.setOutput('app_name', appName);

            const assets = release.assets || [];
            core.info(`Found ${assets.length} assets in release:`);
            assets.forEach(a => core.info(` - ${a.name} (${a.size} bytes)`));

            // Windows .exe
            const winExe = assets.find(a => a.name.endsWith('.exe') && (a.name.includes(region) || !a.name.includes('intl')));
            if (winExe) {
              core.setOutput('win_exe_url', winExe.browser_download_url);
              core.setOutput('win_exe_name', winExe.name);
            }

            // macOS .dmg
            const macDmg = assets.find(a => a.name.endsWith('.dmg') && (a.name.includes(region) || !a.name.includes('intl')));
            if (macDmg) {
              core.setOutput('mac_dmg_url', macDmg.browser_download_url);
              core.setOutput('mac_dmg_name', macDmg.name);
            }

            // Linux .deb
            const deb = assets.find(a => a.name.endsWith('.deb') && (a.name.includes('amd64') || a.name.includes('x86_64') || !a.name.includes('arm64')));
            if (deb) {
              core.setOutput('linux_deb_url', deb.browser_download_url);
              core.setOutput('linux_deb_name', deb.name);
            }

  # ==============================================================================
  # 1. Windows E2E Release Test
  # ==============================================================================
  e2e-windows:
    name: E2E Test Windows (x64)
    needs: resolve-release
    if: |
      needs.resolve-release.outputs.win_exe_url != '' &&
      (github.event_name == 'release' || github.event.inputs.platform_scope == 'windows-only' || github.event.inputs.platform_scope == 'all-platforms')
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js & pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: 'pnpm'

      - name: Install Test Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Download Windows Installer
        shell: pwsh
        run: |
          $url = "${{ needs.resolve-release.outputs.win_exe_url }}"
          $fileName = "${{ needs.resolve-release.outputs.win_exe_name }}"
          Write-Host "Downloading: $url -> $fileName"
          Invoke-WebRequest -Uri $url -OutFile $fileName -UseBasicParsing

      - name: Silent Install and Locate Binary
        shell: pwsh
        run: |
          $installer = "${{ needs.resolve-release.outputs.win_exe_name }}"
          $installDir = "C:\TestApp"
          Write-Host "Executing silent installation to $installDir..."
          $proc = Start-Process -FilePath ".\$installer" -ArgumentList "/S", "/D=$installDir" -PassThru -Wait
          Start-Sleep -Seconds 5

          $exeCandidate = Get-ChildItem -Path $installDir -Filter "*.exe" -Recurse | Where-Object { $_.Name -notmatch "Uninstall" -and $_.Name -match "firefly" } | Select-Object -First 1
          if (-not $exeCandidate) {
            $fallbackDir = Join-Path $env:LOCALAPPDATA "Programs\${{ needs.resolve-release.outputs.app_name }}"
            if (Test-Path $fallbackDir) {
              $exeCandidate = Get-ChildItem -Path $fallbackDir -Filter "*.exe" | Where-Object { $_.Name -notmatch "Uninstall" } | Select-Object -First 1
            }
          }
          if (-not $exeCandidate) {
            throw "Failed to locate installed application executable!"
          }
          Write-Host "Located executable: $($exeCandidate.FullName)"
          "TEST_APP_EXECUTABLE=$($exeCandidate.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Run Playwright Golden Path E2E Test
        shell: pwsh
        run: |
          pnpm playwright test --config=tests/e2e/release-pkg/config/playwright.release.config.ts

      - name: Upload Windows Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-windows
          path: tests/e2e/release-pkg/reports/html
          retention-days: 14

  # ==============================================================================
  # 2. Linux E2E Release Test (Ubuntu with Xvfb)
  # ==============================================================================
  e2e-linux:
    name: E2E Test Linux (DEB / Xvfb)
    needs: resolve-release
    if: |
      needs.resolve-release.outputs.linux_deb_url != '' &&
      (github.event.inputs.platform_scope == 'linux-only' || github.event.inputs.platform_scope == 'all-platforms')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js & pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: 'pnpm'

      - name: Install Linux GUI Runtime Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2 libgbm1 libsecret-1-0 libnotify4 libxss1 libgconf-2-4

      - name: Install Test Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Download and Install DEB Package
        run: |
          wget -q -O /tmp/app.deb "${{ needs.resolve-release.outputs.linux_deb_url }}"
          sudo dpkg -i /tmp/app.deb || sudo apt-get install -f -y

          # Locate installed executable
          if [ -f "/usr/bin/firefly-ai-folder" ]; then
            echo "TEST_APP_EXECUTABLE=/usr/bin/firefly-ai-folder" >> $GITHUB_ENV
          elif [ -f "/usr/bin/firefly-ai-folder-cn" ]; then
            echo "TEST_APP_EXECUTABLE=/usr/bin/firefly-ai-folder-cn" >> $GITHUB_ENV
          elif [ -d "/opt" ]; then
            APP_BIN=$(find /opt -name "firefly*" -type f -executable | grep -v "chrome-sandbox" | head -n 1)
            echo "TEST_APP_EXECUTABLE=$APP_BIN" >> $GITHUB_ENV
          fi

      - name: Run Playwright Golden Path E2E Test (Xvfb)
        run: |
          xvfb-run -a pnpm playwright test --config=tests/e2e/release-pkg/config/playwright.release.config.ts

      - name: Upload Linux Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-linux
          path: tests/e2e/release-pkg/reports/html
          retention-days: 14

  # ==============================================================================
  # 3. macOS E2E Release Test
  # ==============================================================================
  e2e-macos:
    name: E2E Test macOS (ARM64)
    needs: resolve-release
    if: |
      needs.resolve-release.outputs.mac_dmg_url != '' &&
      (github.event.inputs.platform_scope == 'macos-only' || github.event.inputs.platform_scope == 'all-platforms')
    runs-on: macos-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js & pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: 'pnpm'

      - name: Install Test Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Download & Mount macOS DMG
        run: |
          curl -L -o /tmp/app.dmg "${{ needs.resolve-release.outputs.mac_dmg_url }}"
          hdiutil attach /tmp/app.dmg -mountpoint /Volumes/FireflyApp -nobrowse
          mkdir -p /tmp/AppExtract
          cp -R /Volumes/FireflyApp/*.app /tmp/AppExtract/
          hdiutil detach /Volumes/FireflyApp || true

          APP_DIR=$(find /tmp/AppExtract -name "*.app" -maxdepth 1 | head -n 1)
          xattr -dr com.apple.quarantine "$APP_DIR" || true
          APP_EXEC=$(find "$APP_DIR/Contents/MacOS" -type f | head -n 1)
          echo "TEST_APP_EXECUTABLE=$APP_EXEC" >> $GITHUB_ENV

      - name: Run Playwright Golden Path E2E Test
        run: |
          pnpm playwright test --config=tests/e2e/release-pkg/config/playwright.release.config.ts

      - name: Upload macOS Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-macos
          path: tests/e2e/release-pkg/reports/html
          retention-days: 14

  # ==============================================================================
  # 4. Deploy Test Report to GitHub Pages & Summary Dashboard
  # ==============================================================================
  publish-report:
    name: Publish Test Report to GitHub Pages
    needs: [resolve-release, e2e-windows, e2e-linux, e2e-macos]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages Branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
        continue-on-error: true

      - name: Prepare Report Output Directory
        run: |
          mkdir -p reports/${{ github.run_id }}
          mkdir -p public

      - name: Download All Report Artifacts
        uses: actions/download-artifact@v4
        with:
          path: /tmp/all-reports
        continue-on-error: true

      - name: Consolidate Multi-Platform Reports
        run: |
          TARGET_DIR="reports/${{ github.run_id }}"
          mkdir -p "$TARGET_DIR"

          if [ -d "/tmp/all-reports/playwright-report-windows" ]; then
            cp -R /tmp/all-reports/playwright-report-windows "$TARGET_DIR/windows"
          fi
          if [ -d "/tmp/all-reports/playwright-report-linux" ]; then
            cp -R /tmp/all-reports/playwright-report-linux "$TARGET_DIR/linux"
          fi
          if [ -d "/tmp/all-reports/playwright-report-macos" ]; then
            cp -R /tmp/all-reports/playwright-report-macos "$TARGET_DIR/macos"
          fi

          # Generate index entry page for this run
          cat << 'EOF' > "$TARGET_DIR/index.html"
          <!DOCTYPE html>
          <html lang="zh-CN">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Firefly E2E Release Test Report</title>
            <style>
              body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 2rem; }
              .card { background: #1e293b; border-radius: 12px; padding: 1.5rem; max-width: 800px; margin: 0 auto; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); }
              h1 { color: #38bdf8; font-size: 1.5rem; margin-bottom: 1rem; }
              .btn { display: inline-block; padding: 0.75rem 1.5rem; margin: 0.5rem 0.5rem 0.5rem 0; border-radius: 8px; text-decoration: none; font-weight: 600; color: #fff; background: #2563eb; transition: 0.2s; }
              .btn:hover { background: #1d4ed8; }
            </style>
          </head>
          <body>
            <div class="card">
              <h1>🚀 Firefly Release E2E 测试报告仪表盘</h1>
              <p>测试运行 ID: <strong>RUN_ID_PLACEHOLDER</strong></p>
              <hr style="border-color: #334155; margin: 1.5rem 0;">
              <h3>查看各平台交互式 Playwright HTML 测试报告：</h3>
              <div>
                <a class="btn" href="./windows/index.html">🪟 Windows (x64) 测试报告</a>
                <a class="btn" href="./linux/index.html">🐧 Linux (DEB) 测试报告</a>
                <a class="btn" href="./macos/index.html">🍎 macOS (ARM64) 测试报告</a>
              </div>
            </div>
          </body>
          </html>
          EOF

          sed -i "s/RUN_ID_PLACEHOLDER/${{ github.run_id }}/g" "$TARGET_DIR/index.html"

      - name: Deploy to gh-pages Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          keep_files: true
        continue-on-error: true

      - name: Render Job Summary with Report URL
        shell: bash
        run: |
          REPORT_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/reports/${{ github.run_id }}/"
          
          echo "## 📊 Release 安装包 E2E 全流程功能测试结果汇总" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 **在线交互式 HTML 测试报告直达链接**：" >> $GITHUB_STEP_SUMMARY
          echo "> 🌐 [点击查看完整的 Playwright 报告与步骤追踪]($REPORT_URL)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 平台 / 环境 | 目标测试架构 | 执行状态 | 报告子链接 |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Windows** | x64 (NSIS 安装) | ${{ needs.e2e-windows.result }} | [Windows 报告](${REPORT_URL}windows/index.html) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Linux** | x64 (DEB / Xvfb) | ${{ needs.e2e-linux.result }} | [Linux 报告](${REPORT_URL}linux/index.html) |" >> $GITHUB_STEP_SUMMARY
          echo "| **macOS** | ARM64 (DMG 挂载) | ${{ needs.e2e-macos.result }} | [macOS 报告](${REPORT_URL}macos/index.html) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "💡 *注：测试报告包含完整的控制台日志、DOM 状态、各步骤截图与失败录屏。*" >> $GITHUB_STEP_SUMMARY
