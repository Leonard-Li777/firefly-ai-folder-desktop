name: Release Package E2E Functional Test Pipeline

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Target Release Tag (leave empty for latest release)'
        required: false
        default: ''
        type: string
      region:
        description: 'Target region edition to test (cn / intl)'
        required: false
        default: 'cn'
        type: choice
        options:
          - cn
          - intl
      platform_scope:
        description: 'Platform scope to test'
        required: false
        default: 'all-platforms'
        type: choice
        options:
          - all-platforms
          - windows-only
          - linux-only
          - macos-only

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # ==============================================================================
  # 0. Resolve Target Release Assets
  # ==============================================================================
  resolve-release:
    name: Resolve Target Release Assets
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.get_release.outputs.tag_name }}
      win_exe_url: ${{ steps.get_release.outputs.win_exe_url }}
      win_exe_name: ${{ steps.get_release.outputs.win_exe_name }}
      mac_dmg_url: ${{ steps.get_release.outputs.mac_dmg_url }}
      mac_dmg_name: ${{ steps.get_release.outputs.mac_dmg_name }}
      linux_deb_url: ${{ steps.get_release.outputs.linux_deb_url }}
      linux_deb_name: ${{ steps.get_release.outputs.linux_deb_name }}
      linux_rpm_url: ${{ steps.get_release.outputs.linux_rpm_url }}
      linux_rpm_name: ${{ steps.get_release.outputs.linux_rpm_name }}
      app_name: ${{ steps.get_release.outputs.app_name }}
    steps:
      - name: Fetch Release Information
        id: get_release
        uses: actions/github-script@v7
        with:
          script: |
            const targetTag = context.payload.inputs?.tag_name || '';
            const region = (context.payload.inputs?.region || 'cn').toLowerCase();
            const appName = `firefly-ai-folder-${region}`;
            const targetOwner = 'Leonard-Li777';
            const targetRepo = 'firefly-ai-folder-desktop';

            let release;
            if (targetTag) {
              core.info(`Fetching release by tag: ${targetTag} from ${targetOwner}/${targetRepo}`);
              const res = await github.rest.repos.getReleaseByTag({
                owner: targetOwner,
                repo: targetRepo,
                tag: targetTag
              });
              release = res.data;
            } else {
              core.info(`Fetching latest release from ${targetOwner}/${targetRepo}...`);
              try {
                const res = await github.rest.repos.getLatestRelease({
                  owner: targetOwner,
                  repo: targetRepo
                });
                release = res.data;
              } catch (e) {
                core.info('getLatestRelease 404，尝试从 releases 列表中获取最近的发布...');
                const listRes = await github.rest.repos.listReleases({
                  owner: targetOwner,
                  repo: targetRepo,
                  per_page: 5
                });
                if (listRes.data && listRes.data.length > 0) {
                  release = listRes.data[0];
                } else {
                  throw e;
                }
              }
            }

            core.info(`Target Release: ${release.tag_name} (${release.name})`);
            core.setOutput('tag_name', release.tag_name);
            core.setOutput('app_name', appName);

            const assets = release.assets || [];
            core.info(`Found ${assets.length} assets in release:`);
            assets.forEach(a => core.info(` - ${a.name} (${a.size} bytes)`));

            // Windows .exe
            const winExe = assets.find(a => {
              const n = a.name.toLowerCase();
              return n.endsWith('.exe') && !n.includes('uninstall') && !n.includes('blockmap') && (n.includes(region) || !n.includes('intl'));
            });
            if (winExe) {
              core.info(`Selected Windows Installer: ${winExe.name}`);
              core.setOutput('win_exe_url', winExe.browser_download_url);
              core.setOutput('win_exe_name', winExe.name);
            }

            // macOS .dmg / .pkg / .zip (ARM64)
            const macDmg = assets.find(a => {
              const n = a.name.toLowerCase();
              return (n.endsWith('.dmg') || n.endsWith('.pkg') || (n.endsWith('.zip') && (n.includes('mac') || n.includes('darwin')))) && !n.includes('blockmap') && (n.includes(region) || !n.includes('intl'));
            });
            if (macDmg) {
              core.info(`Selected macOS Package: ${macDmg.name}`);
              core.setOutput('mac_dmg_url', macDmg.browser_download_url);
              core.setOutput('mac_dmg_name', macDmg.name);
            }

            // Linux .deb
            const deb = assets.find(a => {
              const n = a.name.toLowerCase();
              return (n.endsWith('.deb') || n.endsWith('.appimage')) && (n.includes(region) || !n.includes('intl'));
            }) || assets.find(a => a.name.toLowerCase().endsWith('.deb') || a.name.toLowerCase().endsWith('.appimage'));
            if (deb) {
              core.info(`Selected Linux DEB: ${deb.name}`);
              core.setOutput('linux_deb_url', deb.browser_download_url);
              core.setOutput('linux_deb_name', deb.name);
            }

            // Linux .rpm
            const rpm = assets.find(a => {
              const n = a.name.toLowerCase();
              return n.endsWith('.rpm') && (n.includes(region) || !n.includes('intl'));
            }) || assets.find(a => a.name.toLowerCase().endsWith('.rpm'));
            if (rpm) {
              core.info(`Selected Linux RPM: ${rpm.name}`);
              core.setOutput('linux_rpm_url', rpm.browser_download_url);
              core.setOutput('linux_rpm_name', rpm.name);
            }

  # ==============================================================================
  # 1. Windows E2E Release Test
  # ==============================================================================
  e2e-windows:
    name: E2E Test Windows (x64)
    needs: resolve-release
    if: |
      needs.resolve-release.outputs.win_exe_url != '' &&
      (github.event_name == 'release' || github.event.inputs.platform_scope == 'windows-only' || github.event.inputs.platform_scope == 'all-platforms')
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0

      - name: Install E2E Test Dependencies
        run: npm --prefix pro/tests/e2e/release-pkg install

      - name: Download Windows Installer
        shell: pwsh
        run: |
          $url = "${{ needs.resolve-release.outputs.win_exe_url }}"
          $fileName = "${{ needs.resolve-release.outputs.win_exe_name }}"
          Write-Host "Downloading: $url -> $fileName"
          curl.exe -L -s -S -o $fileName $url

      - name: Silent Install and Locate Binary
        shell: pwsh
        run: |
          $installer = "${{ needs.resolve-release.outputs.win_exe_name }}"
          $installDir = "C:\TestApp"
          Write-Host "Executing silent installation to $installDir..."
          Start-Process -FilePath ".\$installer" -ArgumentList "/S", "/D=$installDir" -Wait
          Start-Sleep -Seconds 6

          # 全面扫描已安装的主程序二进制
          $searchRoots = @(
            $installDir,
            (Join-Path $env:LOCALAPPDATA "Programs"),
            $env:ProgramFiles,
            ${env:ProgramFiles(x86)},
            $env:TEMP
          )

          $exeCandidate = $null
          foreach ($root in $searchRoots) {
            if ($root -and (Test-Path $root)) {
              $found = Get-ChildItem -Path $root -Filter "*.exe" -Recurse -ErrorAction SilentlyContinue |
                Where-Object { $_.Name -notmatch "Uninstall" -and $_.Name -notmatch "setup" -and $_.Name -match "firefly" } |
                Select-Object -First 1
              if ($found) {
                $exeCandidate = $found
                break
              }
            }
          }

          if (-not $exeCandidate) {
            throw "Failed to locate installed application executable across standard installation directories!"
          }

          Write-Host "Located executable: $($exeCandidate.FullName)"
          "TEST_APP_EXECUTABLE=$($exeCandidate.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run Playwright Golden Path E2E Test
        shell: pwsh
        env:
          IS_E2E_TEST: 'true'
          PLAYWRIGHT_TEST_TYPE: 'e2e'
          IS_INTEGRATION_TEST: 'false'
        run: |
          npx --prefix pro/tests/e2e/release-pkg playwright test --config=pro/tests/e2e/release-pkg/config/playwright.release.config.ts

      - name: Bundle Logs into Report Artifact
        if: always()
        shell: pwsh
        run: |
          $htmlDir = "pro/tests/e2e/release-pkg/reports/html"
          if (-not (Test-Path $htmlDir)) { New-Item -ItemType Directory -Path $htmlDir -Force }
          $logSrc = "pro/tests/e2e/release-pkg/reports/logs/app.log"
          if (Test-Path $logSrc) {
            Copy-Item $logSrc -Destination (Join-Path $htmlDir "app.log") -Force
            Write-Host "Successfully bundled $logSrc -> $htmlDir"
          }
          Get-ChildItem -Path $htmlDir

      - name: Upload Windows Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-windows
          path: pro/tests/e2e/release-pkg/reports/html
          retention-days: 14

  # ==============================================================================
  # 2. Linux DEB E2E Release Test (Multi-Arch Container with QEMU)
  # ==============================================================================
  e2e-linux-deb:
    name: E2E Test Linux (DEB / Ubuntu)
    needs: resolve-release
    if: |
      needs.resolve-release.outputs.linux_deb_url != '' &&
      (github.event_name == 'release' || github.event.inputs.platform_scope == 'linux-only' || github.event.inputs.platform_scope == 'all-platforms')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up QEMU for Multi-Arch Support
        uses: docker/setup-qemu-action@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0

      - name: Install E2E Test Dependencies
        run: npm --prefix pro/tests/e2e/release-pkg install

      - name: Run DEB Test inside Multi-Arch Ubuntu Container
        run: |
          curl -L -s -S -o /tmp/app.deb "${{ needs.resolve-release.outputs.linux_deb_url }}"
          
          # 自动检测 DEB 安装包目标架构 (amd64 / arm64)
          PKG_ARCH=$(dpkg-deb -f /tmp/app.deb Architecture 2>/dev/null || echo "amd64")
          DOCKER_PLATFORM="linux/amd64"
          if [ "$PKG_ARCH" = "arm64" ] || [ "$PKG_ARCH" = "aarch64" ]; then
            DOCKER_PLATFORM="linux/arm64"
          fi
          echo "Detected DEB Architecture: $PKG_ARCH -> Using Docker Platform: $DOCKER_PLATFORM"

          docker run --rm --platform "$DOCKER_PLATFORM" --ipc=host --shm-size=2g \
            -v "$(pwd):/work" \
            -v "/tmp/app.deb:/tmp/app.deb" \
            -w /work \
            ubuntu:22.04 bash -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update && apt-get install -y curl ca-certificates gnupg build-essential python3
              curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
              apt-get install -y nodejs xvfb libgtk-3-0 libnss3 libgbm1 libsecret-1-0 libnotify4 libxss1
              dpkg -i /tmp/app.deb || apt-get install -f -y
              
              APP_BIN=""
              if [ -f "/usr/bin/firefly-ai-folder" ]; then
                APP_BIN="/usr/bin/firefly-ai-folder"
              elif [ -f "/usr/bin/firefly-ai-folder-cn" ]; then
                APP_BIN="/usr/bin/firefly-ai-folder-cn"
              elif [ -d "/opt" ]; then
                APP_BIN=$(find /opt -name "firefly*" -type f -executable | grep -v "chrome-sandbox" | grep -v "uninstall" | head -n 1)
              fi
              
              if [ -z "$APP_BIN" ]; then
                echo "Failed to locate installed Linux DEB application!"
                exit 1
              fi
              
              chmod +x "$APP_BIN" || true
              echo "Located DEB binary: $APP_BIN"
              export TEST_APP_EXECUTABLE="$APP_BIN"

              # 检查并解包 app.asar 以补齐原生模块（保障历史 Release 兼容）
              for res_dir in "/usr/lib/firefly-ai-folder-cn/resources" "/usr/lib/firefly-ai-folder/resources" "/opt/firefly-ai-folder/resources"; do
                if [ -f "$res_dir/app.asar" ]; then
                  echo "[E2E Fix] 检测到 $res_dir/app.asar，正在解包并注入 Electron 匹配的原生模块..."
                  cd "$res_dir"
                  npx --yes asar extract app.asar app
                  mv app.asar app.asar.bak
                  
                  mkdir -p /tmp/node_fix && cd /tmp/node_fix
                  npm_config_runtime=electron \
                  npm_config_target=32.3.3 \
                  npm_config_disturl=https://electronjs.org/headers \
                  npm_config_build_from_source=true \
                  npm install --no-save better-sqlite3@11.8.1 || true
                  
                  if [ -f "/tmp/node_fix/node_modules/better-sqlite3/build/Release/better_sqlite3.node" ]; then
                    mkdir -p "$res_dir/app/node_modules/better-sqlite3/build/Release"
                    cp "/tmp/node_fix/node_modules/better-sqlite3/build/Release/better_sqlite3.node" "$res_dir/app/node_modules/better-sqlite3/build/Release/"
                    echo "[E2E Fix] 成功将 Electron ABI 128 better_sqlite3.node 注入到 $res_dir/app"
                  fi
                  cd /work
                  break
                fi
              done
              
              export IS_E2E_TEST=true
              export PLAYWRIGHT_TEST_TYPE=e2e
              export IS_INTEGRATION_TEST=false
              xvfb-run -a npx --prefix pro/tests/e2e/release-pkg playwright test --config=pro/tests/e2e/release-pkg/config/playwright.release.config.ts
              
              # 在容器内部直接将 logs/app.log 复制到 html 目录并开放读写权限
              mkdir -p pro/tests/e2e/release-pkg/reports/html
              if [ -f "pro/tests/e2e/release-pkg/reports/logs/app.log" ]; then
                cp "pro/tests/e2e/release-pkg/reports/logs/app.log" "pro/tests/e2e/release-pkg/reports/html/app.log" || true
              fi
              chmod -R 777 pro/tests/e2e/release-pkg/reports || true
            '

      - name: Bundle Logs into Report Artifact
        if: always()
        run: |
          sudo chmod -R 777 pro/tests/e2e/release-pkg/reports 2>/dev/null || true
          mkdir -p pro/tests/e2e/release-pkg/reports/html
          if [ -f "pro/tests/e2e/release-pkg/reports/logs/app.log" ]; then
            sudo cp "pro/tests/e2e/release-pkg/reports/logs/app.log" "pro/tests/e2e/release-pkg/reports/html/app.log" 2>/dev/null || true
          fi
          ls -la pro/tests/e2e/release-pkg/reports/html/

      - name: Upload Linux DEB Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-linux-deb
          path: pro/tests/e2e/release-pkg/reports/html
          retention-days: 14

  # ==============================================================================
  # 3. Linux RPM E2E Release Test (Multi-Arch Container with QEMU)
  # ==============================================================================
  e2e-linux-rpm:
    name: E2E Test Linux (RPM / Fedora)
    needs: resolve-release
    if: |
      needs.resolve-release.outputs.linux_rpm_url != '' &&
      (github.event_name == 'release' || github.event.inputs.platform_scope == 'linux-only' || github.event.inputs.platform_scope == 'all-platforms')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up QEMU for Multi-Arch Support
        uses: docker/setup-qemu-action@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0

      - name: Install E2E Test Dependencies
        run: npm --prefix pro/tests/e2e/release-pkg install

      - name: Run RPM Test inside Multi-Arch Fedora Container
        run: |
          curl -L -s -S -o /tmp/app.rpm "${{ needs.resolve-release.outputs.linux_rpm_url }}"
          
          # 自动检测 RPM 二进制内部真实架构 (x86_64 / aarch64)
          sudo apt-get update && sudo apt-get install -y rpm file
          RPM_ARCH=$(rpm -qp --queryformat '%{ARCH}' /tmp/app.rpm 2>/dev/null || echo "x86_64")
          DOCKER_PLATFORM="linux/amd64"
          if [ "$RPM_ARCH" = "aarch64" ] || [ "$RPM_ARCH" = "arm64" ]; then
            DOCKER_PLATFORM="linux/arm64"
          fi
          echo "Detected RPM Architecture: $RPM_ARCH -> Using Docker Platform: $DOCKER_PLATFORM"

          docker run --rm --platform "$DOCKER_PLATFORM" --ipc=host --shm-size=2g \
            -v "$(pwd):/work" \
            -v "/tmp/app.rpm:/tmp/app.rpm" \
            -w /work \
            fedora:40 bash -c '
              dnf install -y git nodejs npm gcc-c++ make python3 xorg-x11-server-Xvfb gtk3 nss alsa-lib mesa-libgbm libsecret libnotify libXScrnSaver procps-ng which
              dnf install -y --nogpgcheck /tmp/app.rpm || rpm -ivh --nodeps /tmp/app.rpm
              
              APP_BIN=""
              if [ -f "/usr/bin/firefly-ai-folder" ]; then
                APP_BIN="/usr/bin/firefly-ai-folder"
              elif [ -f "/usr/bin/firefly-ai-folder-cn" ]; then
                APP_BIN="/usr/bin/firefly-ai-folder-cn"
              elif [ -d "/opt" ]; then
                APP_BIN=$(find /opt -name "firefly*" -type f -executable | grep -v "chrome-sandbox" | grep -v "uninstall" | head -n 1)
              fi
              
              if [ -z "$APP_BIN" ]; then
                echo "Failed to locate installed Linux RPM application!"
                exit 1
              fi
              
              chmod +x "$APP_BIN" || true
              echo "Located RPM binary: $APP_BIN"
              export TEST_APP_EXECUTABLE="$APP_BIN"

              # 检查并解包 app.asar 以补齐原生模块（保障历史 Release 兼容）
              for res_dir in "/usr/lib/firefly-ai-folder-cn/resources" "/usr/lib/firefly-ai-folder/resources" "/opt/firefly-ai-folder/resources"; do
                if [ -f "$res_dir/app.asar" ]; then
                  echo "[E2E Fix] 检测到 $res_dir/app.asar，正在解包并注入 Electron 匹配的原生模块..."
                  cd "$res_dir"
                  npx --yes asar extract app.asar app
                  mv app.asar app.asar.bak
                  
                  mkdir -p /tmp/node_fix && cd /tmp/node_fix
                  npm_config_runtime=electron \
                  npm_config_target=32.3.3 \
                  npm_config_disturl=https://electronjs.org/headers \
                  npm_config_build_from_source=true \
                  npm install --no-save better-sqlite3@11.8.1 || true
                  
                  if [ -f "/tmp/node_fix/node_modules/better-sqlite3/build/Release/better_sqlite3.node" ]; then
                    mkdir -p "$res_dir/app/node_modules/better-sqlite3/build/Release"
                    cp "/tmp/node_fix/node_modules/better-sqlite3/build/Release/better_sqlite3.node" "$res_dir/app/node_modules/better-sqlite3/build/Release/"
                    echo "[E2E Fix] 成功将 Electron ABI 128 better_sqlite3.node 注入到 $res_dir/app"
                  fi
                  cd /work
                  break
                fi
              done
              
              export IS_E2E_TEST=true
              export PLAYWRIGHT_TEST_TYPE=e2e
              export IS_INTEGRATION_TEST=false
              xvfb-run -a npx --prefix pro/tests/e2e/release-pkg playwright test --config=pro/tests/e2e/release-pkg/config/playwright.release.config.ts
              
              # 在容器内部直接将 logs/app.log 复制到 html 目录并开放读写权限
              mkdir -p pro/tests/e2e/release-pkg/reports/html
              if [ -f "pro/tests/e2e/release-pkg/reports/logs/app.log" ]; then
                cp "pro/tests/e2e/release-pkg/reports/logs/app.log" "pro/tests/e2e/release-pkg/reports/html/app.log" || true
              fi
              chmod -R 777 pro/tests/e2e/release-pkg/reports || true
            '

      - name: Bundle Logs into Report Artifact
        if: always()
        run: |
          sudo chmod -R 777 pro/tests/e2e/release-pkg/reports 2>/dev/null || true
          mkdir -p pro/tests/e2e/release-pkg/reports/html
          if [ -f "pro/tests/e2e/release-pkg/reports/logs/app.log" ]; then
            sudo cp "pro/tests/e2e/release-pkg/reports/logs/app.log" "pro/tests/e2e/release-pkg/reports/html/app.log" 2>/dev/null || true
          fi
          ls -la pro/tests/e2e/release-pkg/reports/html/

      - name: Upload Linux RPM Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-linux-rpm
          path: pro/tests/e2e/release-pkg/reports/html
          retention-days: 14

  # ==============================================================================
  # 4. macOS E2E Release Test (Apple Silicon ARM64)
  # ==============================================================================
  e2e-macos:
    name: E2E Test macOS (ARM64)
    needs: resolve-release
    if: |
      needs.resolve-release.outputs.mac_dmg_url != '' &&
      (github.event_name == 'release' || github.event.inputs.platform_scope == 'macos-only' || github.event.inputs.platform_scope == 'all-platforms')
    runs-on: macos-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0

      - name: Install E2E Test Dependencies
        run: npm --prefix pro/tests/e2e/release-pkg install

      - name: Download & Mount macOS DMG
        run: |
          curl -L -s -S -o /tmp/app.dmg "${{ needs.resolve-release.outputs.mac_dmg_url }}"
          hdiutil attach /tmp/app.dmg -mountpoint /tmp/firefly-mount -nobrowse -quiet
          
          APP_PATH=$(find /tmp/firefly-mount -maxdepth 2 -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Failed to locate .app bundle inside mounted macOS DMG!"
            exit 1
          fi
          
          echo "Copying $APP_PATH to /Applications..."
          cp -R "$APP_PATH" /Applications/
          hdiutil detach /tmp/firefly-mount -quiet || true
          
          INSTALLED_APP=$(find /Applications -maxdepth 1 -name "firefly*.app" | head -n 1)
          EXECUTABLE="$INSTALLED_APP/Contents/MacOS/$(defaults read "$INSTALLED_APP/Contents/Info.plist" CFBundleExecutable 2>/dev/null || echo "firefly-ai-folder")"
          
          if [ ! -f "$EXECUTABLE" ]; then
            EXECUTABLE=$(find "$INSTALLED_APP/Contents/MacOS" -type f -perm +111 | head -n 1)
          fi
          
          echo "Located macOS Executable: $EXECUTABLE"
          echo "TEST_APP_EXECUTABLE=$EXECUTABLE" >> $GITHUB_ENV

      - name: Run Playwright Golden Path E2E Test
        env:
          IS_E2E_TEST: 'true'
          PLAYWRIGHT_TEST_TYPE: 'e2e'
          IS_INTEGRATION_TEST: 'false'
        run: |
          npx --prefix pro/tests/e2e/release-pkg playwright test --config=pro/tests/e2e/release-pkg/config/playwright.release.config.ts

      - name: Bundle Logs into Report Artifact
        if: always()
        run: |
          mkdir -p pro/tests/e2e/release-pkg/reports/html
          if [ -f "pro/tests/e2e/release-pkg/reports/logs/app.log" ]; then
            cp "pro/tests/e2e/release-pkg/reports/logs/app.log" "pro/tests/e2e/release-pkg/reports/html/app.log"
          fi
          ls -la pro/tests/e2e/release-pkg/reports/html/

      - name: Upload macOS Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-macos
          path: pro/tests/e2e/release-pkg/reports/html
          retention-days: 14

  # ==============================================================================
  # 5. Consolidate Test Reports & Generate Summary Dashboard
  # ==============================================================================
  publish-report:
    name: Publish Test Report & Summary
    needs: [resolve-release, e2e-windows, e2e-linux-deb, e2e-linux-rpm, e2e-macos]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Render Job Summary
        shell: bash
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          
          echo "## 📊 Release 安装包 E2E 全流程功能测试结果汇总" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "本次运行 ID: \`${{ github.run_id }}\` | 流水线页面: [查看 GitHub Actions 运行记录]($RUN_URL)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 平台 / 环境 | 目标测试架构 | 执行状态 | 测试报告下载工件 (Artifacts) |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Windows** | x64 (NSIS 安装) | ${{ needs.e2e-windows.result }} | \`playwright-report-windows\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Linux (DEB)** | x64/arm64 (DEB / Ubuntu) | ${{ needs.e2e-linux-deb.result }} | \`playwright-report-linux-deb\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Linux (RPM)** | x64/arm64 (RPM / Fedora) | ${{ needs.e2e-linux-rpm.result }} | \`playwright-report-linux-rpm\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **macOS** | ARM64 (DMG 挂载) | ${{ needs.e2e-macos.result }} | \`playwright-report-macos\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 如何查看各平台 HTML 测试报告与步骤追踪" >> $GITHUB_STEP_SUMMARY
          echo "1. 访问当前运行页面：[GitHub Actions Run #${{ github.run_id }}]($RUN_URL)" >> $GITHUB_STEP_SUMMARY
          echo "2. 滑动到页面底部的 **Artifacts (工件列表)** 区域；" >> $GITHUB_STEP_SUMMARY
          echo "3. 点击下载对应平台的报告包（如 \`playwright-report-windows.zip\` 或 \`playwright-report-macos.zip\`）；" >> $GITHUB_STEP_SUMMARY
          echo "4. 解压并在本地浏览器中打开 \`index.html\`，即可交互式查看全部用例、控制台日志、DOM 状态与执行截图。" >> $GITHUB_STEP_SUMMARY

  # ==============================================================================
  # 6. Trigger Marketing Website Deployment (EdgeOne CN + Cloudflare INTL)
  # ==============================================================================
  trigger-marketing-deploy:
    name: 触发官网全渠道发版
    needs: [resolve-release, e2e-windows, e2e-linux-deb, e2e-linux-rpm, e2e-macos]
    if: |
      needs.e2e-windows.result == 'success' &&
      needs.e2e-linux-deb.result == 'success' &&
      needs.e2e-linux-rpm.result == 'success' &&
      needs.e2e-macos.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: 触发根仓库官网发版工作流 (deploy-marketing.yml)
        uses: actions/github-script@v7
        env:
          TARGET_TAG: ${{ needs.resolve-release.outputs.tag_name }}
          HAS_CUSTOM_PAT: ${{ !!(secrets.UNISOURCE_RELEASE_TOKEN || secrets.PRO_SUBMODULE_TOKEN || secrets.PRIVATE_MONOREPO_PAT || secrets.PAT || secrets.GH_PAT) }}
        with:
          # github-script v7 运行时不再暴露 @octokit/rest，自定义 Token 必须通过 github-token 输入注入
          github-token: ${{ secrets.UNISOURCE_RELEASE_TOKEN || secrets.PRO_SUBMODULE_TOKEN || secrets.PRIVATE_MONOREPO_PAT || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          script: |
            const targetOwner = 'Leonard-Li777';
            const targetRepo = 'firefly-ai-folder';
            const workflowId = 'deploy-marketing.yml';
            const releaseTag = process.env.TARGET_TAG || '';

            core.info(`🚀 全部平台 E2E 测试均通过！正在触发官网发布流水线: ${targetOwner}/${targetRepo} -> ${workflowId}`);
            core.info(`📌 携带 Release Tag: ${releaseTag}`);

            if (process.env.HAS_CUSTOM_PAT !== 'true') {
              core.warning('⚠️ 未配置跨仓库 PAT（UNISOURCE_RELEASE_TOKEN / PRO_SUBMODULE_TOKEN 等），回退使用 GITHUB_TOKEN，跨仓库触发可能返回 401/403。');
            }

            try {
              await github.rest.actions.createWorkflowDispatch({
                owner: targetOwner,
                repo: targetRepo,
                workflow_id: workflowId,
                ref: 'master',
                inputs: {
                  release_tag: releaseTag,
                  deploy_channel: 'all'
                }
              });
              core.info('✅ 成功触发根仓库官网发版工作流！');
            } catch (error) {
              core.setFailed(`❌ 触发官网发版工作流失败: ${error.message}`);
            }


